<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#00346f">
<meta name="description" content="Cálculo, listados e informes de los gastos de colaboradores de un proceso electoral en Canarias.">
<title>Gestión Electoral — Gastos de colaboradores</title>
<style>
/* Sistema visual "Civic Authority" — tomado del prototipo de Stitch.
   Es un diseño institucional que se compromete deliberadamente con el modo claro:
   la neutralidad y la previsibilidad importan más aquí que adaptarse al tema del
   dispositivo, así que se fija color-scheme y no se ofrece variante oscura. */
:root {
  color-scheme: light;

  --primary: #00346f;
  --primary-container: #004a99;
  --surface-tint: #255dad;
  --on-primary: #ffffff;
  --secondary: #505f76;
  --secondary-container: #d0e1fb;

  --background: #f9f9ff;
  --surface: #ffffff;
  --surface-low: #f3f3fa;
  --surface-container: #ededf5;

  --on-surface: #191c21;
  --on-surface-variant: #424751;
  --muted: #737783;
  --outline: #c2c6d3;
  --outline-strong: #a9aebc;

  --error: #ba1a1a;
  --error-container: #ffdad6;
  --good: #0f7a3d;
  --good-container: #d8f2e3;
  --warning-container: #fdefd2;
  --on-warning-container: #6b4a04;

  --serie: #255dad;
  --serie-suave: #b7d3f6;
  --gridline: #e6e7ee;

  --radio: 4px;
  --radio-lg: 8px;
  --sombra: 0 4px 12px rgba(0, 0, 0, 0.04);
  --sombra-flotante: 0 4px 12px rgba(0, 0, 0, 0.08);

  --sidebar: 268px;
  --filtros: 300px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 14px;
  line-height: 1.5;
  color: var(--on-surface);
  background: var(--background);
  -webkit-text-size-adjust: 100%;
}

h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
h1 { font-size: 32px; line-height: 1.25; }
h2 { font-size: 20px; }
h3 { font-size: 15px; }
p { margin: 0; }

button { font: inherit; cursor: pointer; }
a { color: var(--primary-container); }

.num { font-variant-numeric: tabular-nums; }

/* ---------- Armazón ---------- */

.app { display: flex; min-height: 100vh; }

.topbar {
  position: sticky; top: 0; z-index: 30;
  display: none;
  align-items: center; gap: 12px;
  padding: 10px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--outline);
}
.topbar strong { color: var(--primary); font-size: 16px; }

.sidebar {
  width: var(--sidebar);
  flex: 0 0 var(--sidebar);
  background: var(--surface);
  border-right: 1px solid var(--outline);
  padding: 24px 16px;
  display: flex; flex-direction: column; gap: 24px;
  position: sticky; top: 0; height: 100vh;
}
.marca-titulo { color: var(--primary); font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.marca-sub {
  color: var(--muted); font-size: 11px; font-weight: 600;
  letter-spacing: 0.08em; text-transform: uppercase; margin-top: 2px;
}

.nav { display: flex; flex-direction: column; gap: 4px; }
.nav button {
  display: flex; align-items: center; gap: 12px;
  width: 100%; text-align: left;
  padding: 10px 12px;
  border: 0; border-radius: var(--radio);
  background: transparent; color: var(--on-surface-variant);
  font-weight: 500;
}
.nav button:hover { background: var(--surface-low); }
.nav button[aria-current="page"] {
  background: var(--secondary-container);
  color: var(--primary); font-weight: 600;
}
.nav .ico { width: 20px; flex: 0 0 20px; opacity: 0.85; }

.principal { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.contenido { flex: 1; padding: 32px; max-width: 1400px; width: 100%; }

.cabecera-pagina { margin-bottom: 28px; }
.cabecera-pagina p { color: var(--on-surface-variant); margin-top: 6px; font-size: 15px; }

.pie {
  border-top: 1px solid var(--outline);
  padding: 16px 32px;
  color: var(--muted); font-size: 12px;
  display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
}

/* ---------- Piezas ---------- */

.tarjeta {
  background: var(--surface);
  border: 1px solid var(--outline);
  border-radius: var(--radio-lg);
  box-shadow: var(--sombra);
  padding: 24px;
}
.tarjeta > header {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; flex-wrap: wrap;
  padding-bottom: 14px; margin-bottom: 20px;
  border-bottom: 1px solid var(--outline);
}
.tarjeta > header h2 { color: var(--primary); display: flex; align-items: center; gap: 10px; }

.rejilla { display: grid; gap: 24px; }
.rejilla.dos { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.rejilla.tres { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.rejilla.cuatro { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.rejilla.principal-lateral { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }

.kpi { display: flex; flex-direction: column; gap: 6px; }
.kpi .etiqueta {
  font-size: 11px; font-weight: 600; letter-spacing: 0.07em;
  text-transform: uppercase; color: var(--muted);
}
.kpi .valor {
  font-size: clamp(22px, 1.9vw, 28px);
  font-weight: 700; letter-spacing: -0.02em;
  white-space: nowrap;
}
.kpi .valor.destacado { color: var(--primary); }
.kpi .nota { font-size: 12px; color: var(--on-surface-variant); }

label { display: block; font-size: 12px; font-weight: 600; color: var(--on-surface-variant); margin-bottom: 6px; }

input[type="text"], input[type="number"], input[type="search"], select {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid var(--outline);
  border-radius: var(--radio);
  background: var(--surface);
  color: var(--on-surface);
  font: inherit;
}
input:focus-visible, select:focus-visible, button:focus-visible, .zona-carga:focus-visible {
  outline: 2px solid var(--surface-tint);
  outline-offset: 1px;
}
input[type="number"] { text-align: right; font-variant-numeric: tabular-nums; }

.campo-euro { position: relative; }
.campo-euro input { padding-right: 30px; }
.campo-euro::after {
  content: "€"; position: absolute; right: 11px; top: 50%; transform: translateY(-50%);
  color: var(--muted); pointer-events: none;
}

.campo { margin-bottom: 0; }
.campo-linea {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 14px;
  background: var(--surface-low);
  border: 1px solid var(--outline);
  border-radius: var(--radio);
}
.campo-linea label { margin: 0; font-size: 13px; font-weight: 500; color: var(--on-surface); }
.campo-linea .campo-euro { width: 116px; flex: 0 0 116px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 18px;
  border-radius: var(--radio);
  border: 1px solid transparent;
  font-weight: 600; font-size: 14px;
  background: var(--primary); color: var(--on-primary);
}
.btn:hover { background: var(--primary-container); }
.btn.secundario { background: var(--surface); color: var(--primary); border-color: var(--outline-strong); }
.btn.secundario:hover { background: var(--surface-low); }
.btn.fantasma { background: transparent; color: var(--on-surface-variant); border-color: transparent; }
.btn.fantasma:hover { background: var(--surface-low); }
.btn.peligro { background: transparent; color: var(--error); border-color: var(--outline); }
.btn.peligro:hover { background: var(--error-container); }
.btn.pequeno { padding: 6px 11px; font-size: 12px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 9px; border-radius: 999px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.03em;
}
.chip.ok { background: var(--good-container); color: var(--good); }
.chip.pendiente { background: var(--surface-container); color: var(--on-surface-variant); }
.chip.aviso { background: var(--warning-container); color: var(--on-warning-container); }

.aviso {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 14px 16px; border-radius: var(--radio);
  background: var(--warning-container); color: var(--on-warning-container);
  font-size: 13px; line-height: 1.55;
}
.aviso.error { background: var(--error-container); color: var(--error); }
.aviso.ok { background: var(--good-container); color: var(--good); }
.aviso .ico { flex: 0 0 20px; }

/* ---------- Filtros ---------- */

.panel-filtros {
  width: var(--filtros); flex: 0 0 var(--filtros);
  background: var(--surface);
  border-right: 1px solid var(--outline);
  padding: 24px 20px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  display: flex; flex-direction: column; gap: 22px;
}
.panel-filtros h2 {
  font-size: 12px; font-weight: 700; letter-spacing: 0.09em;
  text-transform: uppercase; color: var(--on-surface-variant);
}

.grupo-filtro > .titulo-filtro {
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  margin-bottom: 8px;
}
.titulo-filtro strong { font-size: 13px; font-weight: 600; }
.titulo-filtro .cuenta { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

.acciones-filtro { display: flex; gap: 6px; margin-bottom: 8px; }
.acciones-filtro button {
  flex: 1; padding: 5px 8px; font-size: 11px; font-weight: 600;
  border: 1px solid var(--outline); border-radius: var(--radio);
  background: var(--surface); color: var(--primary);
}
.acciones-filtro button:hover { background: var(--secondary-container); }

.lista-check {
  max-height: 216px; overflow-y: auto;
  border: 1px solid var(--outline); border-radius: var(--radio);
  background: var(--surface);
}
.lista-check.corta { max-height: none; }
.opcion-check {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 11px;
  font-size: 13px; cursor: pointer;
  border-bottom: 1px solid var(--surface-low);
}
.opcion-check:last-child { border-bottom: 0; }
.opcion-check:hover { background: var(--surface-low); }
.opcion-check input { accent-color: var(--primary); width: 15px; height: 15px; flex: 0 0 15px; margin: 0; }
.opcion-check .texto { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.opcion-check .meta { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.opcion-check.desactivada { opacity: 0.4; pointer-events: none; }

/* ---------- Gráficas ---------- */

.gr-barras { display: flex; flex-direction: column; gap: 10px; }
.gr-fila {
  display: grid;
  grid-template-columns: minmax(110px, 244px) minmax(40px, 1fr) auto;
  gap: 12px; align-items: center;
}
.gr-etiqueta {
  font-size: 12px; color: var(--on-surface-variant);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.gr-barras.compacta { gap: 16px; }
.gr-barras.compacta .gr-fila { display: block; }
.gr-cabeza {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 10px; margin-bottom: 6px;
}
.gr-barras.compacta .gr-etiqueta {
  font-size: 13px; font-weight: 600; color: var(--on-surface);
  white-space: normal; overflow: visible;
}
.gr-barras.compacta .gr-pista { height: 8px; }
.gr-barras.compacta .gr-valor { min-width: 0; }
.gr-pista {
  position: relative; height: 20px;
  background: var(--surface-low);
  border-radius: var(--radio);
  overflow: hidden;
}
.gr-barra {
  height: 100%;
  background: var(--serie);
  border-radius: 0 var(--radio) var(--radio) 0;
  min-width: 2px;
  transition: width 220ms ease;
}
.gr-valor {
  font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums;
  color: var(--on-surface); white-space: nowrap; text-align: right;
  min-width: 92px;
}
.gr-fila:hover .gr-barra { background: var(--primary); }
.gr-vacia { color: var(--muted); font-size: 13px; padding: 24px 0; text-align: center; }

.leyenda-nota {
  margin-top: 16px; padding-top: 14px;
  border-top: 1px solid var(--gridline);
  font-size: 12px; color: var(--muted); line-height: 1.55;
}

/* ---------- Tablas ---------- */

.pestanas { display: flex; gap: 4px; flex-wrap: wrap; }
.pestanas button {
  padding: 7px 13px; font-size: 13px; font-weight: 600;
  border: 1px solid var(--outline); border-radius: var(--radio);
  background: var(--surface); color: var(--on-surface-variant);
}
.pestanas button[aria-selected="true"] {
  background: var(--secondary-container); color: var(--primary); border-color: var(--secondary-container);
}

/* El desglose puede tener 88 filas y una docena de columnas: se le da su propio
   marco con scroll en los dos ejes para que nunca empuje el ancho de la página. */
.tabla-scroll { overflow-x: auto; }
.tabla-scroll.alta { max-height: 560px; overflow-y: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
tbody td, thead th, tfoot td { white-space: nowrap; }
thead th {
  position: sticky; top: 0; z-index: 1;
  background: var(--surface-low);
  text-align: left; font-size: 11px; font-weight: 700;
  letter-spacing: 0.06em; text-transform: uppercase; color: var(--on-surface-variant);
  padding: 10px 12px; white-space: nowrap;
  border-bottom: 1px solid var(--outline);
}
tbody td { padding: 9px 12px; border-bottom: 1px solid var(--gridline); }
tbody tr:nth-child(even) { background: #fbfbfe; }
tbody tr:hover { background: var(--surface-low); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
tfoot td {
  padding: 12px; font-weight: 700;
  border-top: 2px solid var(--outline); background: var(--surface-low);
  font-variant-numeric: tabular-nums;
}
.sin-datos { padding: 40px 16px; text-align: center; color: var(--muted); }

/* ---------- Carga de ficheros ---------- */

.zona-carga {
  border: 2px dashed var(--outline-strong);
  border-radius: var(--radio-lg);
  background: var(--surface);
  padding: 28px 20px; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  transition: background 150ms ease, border-color 150ms ease;
}
.zona-carga.encima { border-color: var(--primary); background: var(--secondary-container); }
.zona-carga .icono-zona {
  width: 48px; height: 48px; border-radius: var(--radio-lg);
  background: var(--secondary-container); color: var(--primary);
  display: flex; align-items: center; justify-content: center;
}
.zona-carga h3 { font-size: 16px; }
.zona-carga .pista { color: var(--muted); font-size: 13px; }
.zona-carga input[type="file"] { display: none; }

/* ---------- Utilidades ---------- */

.fila { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.fila.fin { justify-content: flex-end; }
.entre { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.apilar { display: flex; flex-direction: column; gap: 16px; }
.apilar.junto { gap: 10px; }
.crece { flex: 1; min-width: 0; }
.silencio { color: var(--muted); font-size: 12px; }
.oculto { display: none !important; }

.barra-guardar {
  position: sticky; bottom: 0; z-index: 20;
  display: flex; justify-content: flex-end; align-items: center; gap: 16px;
  padding: 14px 32px;
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(6px);
  border-top: 1px solid var(--outline);
}

.aviso-flotante {
  position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
  z-index: 60; max-width: min(520px, calc(100vw - 32px));
  padding: 12px 18px; border-radius: var(--radio);
  background: var(--on-surface); color: #fff;
  box-shadow: var(--sombra-flotante);
  font-size: 13px;
}
.aviso-flotante.error { background: var(--error); }

/* ---------- Adaptación a pantallas estrechas ---------- */

@media (max-width: 1180px) {
  .rejilla.cuatro { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .rejilla.principal-lateral, .rejilla.tres { grid-template-columns: minmax(0, 1fr); }
}

@media (max-width: 900px) {
  .app { flex-direction: column; }
  .topbar { display: flex; }
  .sidebar {
    position: fixed; inset: 0 auto 0 0; z-index: 50;
    transform: translateX(-100%); transition: transform 200ms ease;
    box-shadow: var(--sombra-flotante);
  }
  .app.menu-abierto .sidebar { transform: none; }
  .velo {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(25, 28, 33, 0.4);
  }
  .panel-filtros {
    width: 100%; flex-basis: auto; height: auto; position: static;
    border-right: 0; border-bottom: 1px solid var(--outline);
  }
  .contenido { padding: 20px 16px; }
  .rejilla.dos, .rejilla.cuatro { grid-template-columns: minmax(0, 1fr); }
  .barra-guardar { padding: 12px 16px; }
  h1 { font-size: 24px; }
  .gr-fila { grid-template-columns: 1fr auto; }
  .gr-etiqueta { grid-column: 1 / -1; }
}

/* ---------- Impresión / exportación a PDF ---------- */

@media print {
  @page { size: A4 landscape; margin: 14mm; }
  body { background: #fff; font-size: 10.5pt; }
  .sidebar, .panel-filtros, .topbar, .pie, .barra-guardar,
  .no-imprimir, .velo, .aviso-flotante { display: none !important; }
  .app, .principal { display: block; }
  .contenido { padding: 0; max-width: none; }
  .tarjeta {
    box-shadow: none; border-color: #b9bdc9;
    break-inside: avoid; page-break-inside: avoid;
  }
  .rejilla { gap: 12px; }
  .rejilla.cuatro { grid-template-columns: repeat(4, 1fr); }
  .tabla-scroll, .tabla-scroll.alta { overflow: visible; max-height: none; }
  table { font-size: 8.5pt; }
  tbody td, thead th, tfoot td { white-space: normal; padding: 5px 6px; }
  thead { display: table-header-group; }
  thead th { position: static; }
  tr { break-inside: avoid; page-break-inside: avoid; }
  .lista-check { max-height: none; }
  .solo-impresion { display: block !important; }
  .gr-barra { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

.solo-impresion { display: none; }
.cabecera-impresion { margin-bottom: 18px; }
.cabecera-impresion h1 { font-size: 20pt; color: var(--primary); }
.cabecera-impresion .meta { color: var(--on-surface-variant); font-size: 10pt; margin-top: 4px; }

/* ---------- Carga de datos ---------- */

.zona-carga.grande { padding: 40px 24px; }
.zona-carga.grande h3 { font-size: 17px; max-width: 30ch; }

.columna-reconocida { display: flex; flex-direction: column; gap: 6px; }
.columna-reconocida .fila { gap: 8px; color: var(--primary); }
.cabecera-esperada {
  display: inline-block; align-self: flex-start;
  padding: 3px 8px; border-radius: var(--radio);
  background: var(--surface-container);
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11.5px; letter-spacing: 0.02em;
  color: var(--on-surface-variant);
}

.ficha-censo {
  display: flex; flex-direction: column; gap: 10px; align-items: flex-start;
  padding: 16px;
  border: 1px solid var(--outline);
  border-radius: var(--radio);
  background: var(--surface-low);
}
.ficha-censo .entre { width: 100%; }

/* ---------- Diálogo de confirmación ---------- */

.velo-modal {
  position: fixed; inset: 0; z-index: 80;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  background: rgba(25, 28, 33, 0.45);
  backdrop-filter: blur(4px);
}
.modal {
  width: min(480px, 100%);
  background: var(--surface);
  border-radius: var(--radio-lg);
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.22);
  overflow: hidden;
}
.cuerpo-modal { padding: 24px; display: flex; flex-direction: column; gap: 12px; }
.cuerpo-modal h2 { color: var(--primary); }
.cuerpo-modal p { color: var(--on-surface-variant); line-height: 1.55; }
.lista-modal {
  margin: 0; padding: 12px 14px 12px 30px;
  background: var(--surface-low);
  border: 1px solid var(--outline);
  border-radius: var(--radio);
  color: var(--on-surface);
}
.lista-modal li { margin: 3px 0; }
.nota-modal {
  padding: 10px 12px; border-radius: var(--radio);
  background: var(--warning-container);
  color: var(--on-warning-container) !important;
  font-size: 13px;
}
.pie-modal {
  display: flex; justify-content: flex-end; gap: 10px;
  padding: 16px 24px;
  background: var(--surface-low);
  border-top: 1px solid var(--outline);
}
.btn.peligro-solido { background: var(--error); color: #fff; border-color: var(--error); }
.btn.peligro-solido:hover { background: #8f1414; }

.lista-rechazos {
  margin: 8px 0 0; padding: 8px 12px 8px 26px;
  max-height: 200px; overflow-y: auto;
  background: rgba(255, 255, 255, 0.5);
  border-radius: var(--radio);
}
.lista-rechazos li { margin: 2px 0; font-variant-numeric: tabular-nums; }

/* ---------- Acceso y sesión ---------- */

.acceso {
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 24px;
  background: var(--background);
}
.tarjeta-acceso {
  width: min(440px, 100%);
  display: flex; flex-direction: column; gap: 18px;
  text-align: center; align-items: center;
  padding: 36px 32px;
}
.tarjeta-acceso .marca-titulo { font-size: 26px; }
.tarjeta-acceso .aviso { text-align: left; }

<body>
<div id="app" class="app"></div>
<script>
/* ===== 00-geo.js ===== */
/* Estructura territorial electoral de Canarias.
   Provincia > Isla > Municipio. Los códigos son los del INE (35xxx Las Palmas,
   38xxx Santa Cruz de Tenerife). Los colegios electorales no se modelan todavía;
   la unidad de cálculo es la mesa, que cuelga directamente del municipio. */
(function (App) {
  'use strict';

  var PROVINCIAS = [
    { id: '35', nombre: 'Las Palmas' },
    { id: '38', nombre: 'Santa Cruz de Tenerife' }
  ];

  var ISLAS = [
    { id: '351', nombre: 'Fuerteventura', provincia: '35' },
    { id: '352', nombre: 'Gran Canaria', provincia: '35' },
    { id: '353', nombre: 'Lanzarote', provincia: '35' },
    { id: '381', nombre: 'La Gomera', provincia: '38' },
    { id: '382', nombre: 'El Hierro', provincia: '38' },
    { id: '383', nombre: 'La Palma', provincia: '38' },
    { id: '384', nombre: 'Tenerife', provincia: '38' }
  ];

  /* [codigo, nombre, isla] */
  var M = [
    ['35001', 'Agaete', '352'],
    ['35002', 'Agüimes', '352'],
    ['35003', 'Antigua', '351'],
    ['35004', 'Arrecife', '353'],
    ['35005', 'Artenara', '352'],
    ['35006', 'Arucas', '352'],
    ['35007', 'Betancuria', '351'],
    ['35008', 'Firgas', '352'],
    ['35009', 'Gáldar', '352'],
    ['35010', 'Haría', '353'],
    ['35011', 'Ingenio', '352'],
    ['35012', 'Mogán', '352'],
    ['35013', 'Moya', '352'],
    ['35014', 'Oliva, La', '351'],
    ['35015', 'Pájara', '351'],
    ['35016', 'Palmas de Gran Canaria, Las', '352'],
    ['35017', 'Puerto del Rosario', '351'],
    ['35018', 'San Bartolomé', '353'],
    ['35019', 'San Bartolomé de Tirajana', '352'],
    ['35020', 'Aldea de San Nicolás, La', '352'],
    ['35021', 'Santa Brígida', '352'],
    ['35022', 'Santa Lucía de Tirajana', '352'],
    ['35023', 'Santa María de Guía de Gran Canaria', '352'],
    ['35024', 'Teguise', '353'],
    ['35025', 'Tejeda', '352'],
    ['35026', 'Telde', '352'],
    ['35027', 'Teror', '352'],
    ['35028', 'Tías', '353'],
    ['35029', 'Tinajo', '353'],
    ['35030', 'Tuineje', '351'],
    ['35031', 'Valsequillo de Gran Canaria', '352'],
    ['35032', 'Valleseco', '352'],
    ['35033', 'Vega de San Mateo', '352'],
    ['35034', 'Yaiza', '353'],

    ['38001', 'Adeje', '384'],
    ['38002', 'Agulo', '381'],
    ['38003', 'Alajeró', '381'],
    ['38004', 'Arafo', '384'],
    ['38005', 'Arico', '384'],
    ['38006', 'Arona', '384'],
    ['38007', 'Barlovento', '383'],
    ['38008', 'Breña Alta', '383'],
    ['38009', 'Breña Baja', '383'],
    ['38010', 'Buenavista del Norte', '384'],
    ['38011', 'Candelaria', '384'],
    ['38012', 'Fasnia', '384'],
    ['38013', 'Frontera', '382'],
    ['38014', 'Fuencaliente de la Palma', '383'],
    ['38015', 'Garachico', '384'],
    ['38016', 'Garafía', '383'],
    ['38017', 'Granadilla de Abona', '384'],
    ['38018', 'Guancha, La', '384'],
    ['38019', 'Guía de Isora', '384'],
    ['38020', 'Güímar', '384'],
    ['38021', 'Hermigua', '381'],
    ['38022', 'Icod de los Vinos', '384'],
    ['38023', 'San Cristóbal de La Laguna', '384'],
    ['38024', 'Llanos de Aridane, Los', '383'],
    ['38025', 'Matanza de Acentejo, La', '384'],
    ['38026', 'Orotava, La', '384'],
    ['38027', 'Paso, El', '383'],
    ['38028', 'Puerto de la Cruz', '384'],
    ['38029', 'Puntagorda', '383'],
    ['38030', 'Puntallana', '383'],
    ['38031', 'Realejos, Los', '384'],
    ['38032', 'Rosario, El', '384'],
    ['38033', 'San Andrés y Sauces', '383'],
    ['38034', 'San Juan de la Rambla', '384'],
    ['38035', 'San Miguel de Abona', '384'],
    ['38036', 'San Sebastián de la Gomera', '381'],
    ['38037', 'Santa Cruz de la Palma', '383'],
    ['38038', 'Santa Cruz de Tenerife', '384'],
    ['38039', 'Santa Úrsula', '384'],
    ['38040', 'Santiago del Teide', '384'],
    ['38041', 'Sauzal, El', '384'],
    ['38042', 'Silos, Los', '384'],
    ['38043', 'Tacoronte', '384'],
    ['38044', 'Tanque, El', '384'],
    ['38045', 'Tazacorte', '383'],
    ['38046', 'Tegueste', '384'],
    ['38047', 'Tijarafe', '383'],
    ['38048', 'Valverde', '382'],
    ['38049', 'Valle Gran Rey', '381'],
    ['38050', 'Vallehermoso', '381'],
    ['38051', 'Victoria de Acentejo, La', '384'],
    ['38052', 'Vilaflor de Chasna', '384'],
    ['38053', 'Villa de Mazo', '383'],
    ['38901', 'Pinar de El Hierro, El', '382']
  ];

  var islaPorId = {};
  ISLAS.forEach(function (i) { islaPorId[i.id] = i; });

  var MUNICIPIOS = M.map(function (row) {
    return {
      codigo: row[0],
      nombre: row[1],
      isla: row[2],
      provincia: islaPorId[row[2]].provincia
    };
  });

  var porCodigo = {};
  MUNICIPIOS.forEach(function (m) { porCodigo[m.codigo] = m; });

  /* Índice de búsqueda por nombre normalizado, para casar los nombres que vengan
     en los ficheros CSV/Excel aunque lleguen sin código, en mayúsculas o con
     el artículo delante ("La Oliva" vs "Oliva, La"). */
  function normaliza(txt) {
    return String(txt || '')
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .replace(/[^a-z0-9ñ ]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  var ARTICULOS = ['la', 'el', 'los', 'las'];

  function variantes(nombre) {
    var base = normaliza(nombre);
    var out = [base];
    // "oliva, la" -> "la oliva"
    var m = /^(.*) (la|el|los|las)$/.exec(base);
    if (m) { out.push(m[2] + ' ' + m[1]); }
    // "la oliva" -> "oliva la"
    var partes = base.split(' ');
    if (ARTICULOS.indexOf(partes[0]) >= 0 && partes.length > 1) {
      out.push(partes.slice(1).join(' ') + ' ' + partes[0]);
      out.push(partes.slice(1).join(' '));
    }
    return out;
  }

  var indiceNombre = {};
  MUNICIPIOS.forEach(function (m) {
    variantes(m.nombre).forEach(function (v) {
      if (!(v in indiceNombre)) { indiceNombre[v] = m.codigo; }
    });
  });

  /* Resuelve una celda de municipio que puede venir como "35001", "35001 AGAETE",
     "AGAETE" o "Agaete (Las Palmas)". Devuelve el código o null. */
  function resolverMunicipio(valor) {
    if (valor == null) { return null; }
    var txt = String(valor).trim();
    if (!txt) { return null; }

    var codigo = /(\d{5})/.exec(txt);
    if (codigo && porCodigo[codigo[1]]) { return codigo[1]; }

    var sinCodigo = txt.replace(/^\s*\d+\s*[-.]?\s*/, '');
    var candidatos = variantes(sinCodigo);
    for (var i = 0; i < candidatos.length; i++) {
      if (indiceNombre[candidatos[i]]) { return indiceNombre[candidatos[i]]; }
    }
    return null;
  }

  /* Formas en que un fichero puede nombrar a cada provincia. Sirve para
     contrastar la columna PROVINCIA, cuando existe, contra la que le
     corresponde al municipio por su código. */
  var ALIAS_PROVINCIA = {
    '35': ['35', 'las palmas', 'palmas las', 'palmas', 'provincia de las palmas'],
    '38': ['38', 'santa cruz de tenerife', 's c de tenerife', 'sc de tenerife',
      'sta cruz de tenerife', 'santa cruz tenerife', 'tenerife',
      'provincia de santa cruz de tenerife']
  };

  /* Clave de orden alfabético: "Oliva, La" y "La Oliva" deben alfabetizarse
     por "Oliva", no por el artículo. */
  function claveOrden(nombre) {
    var base = String(nombre || '');
    var conComa = /^(.*), (La|El|Los|Las)$/.exec(base);
    if (conComa) { return conComa[1]; }
    var conArticulo = /^(La|El|Los|Las) (.*)$/.exec(base);
    if (conArticulo) { return conArticulo[2]; }
    return base;
  }

  /* Compara dos nombres de isla o municipio ignorando el artículo, en
     cualquiera de sus dos formas ("La Gomera" o "Gomera, La"). Sirve tanto
     para ordenar listas como para ordenar columnas de una tabla. */
  function compararNombres(a, b) {
    return normaliza(claveOrden(a)).localeCompare(normaliza(claveOrden(b)), 'es');
  }

  /* Copia ordenada alfabéticamente (por nombre, ignorando el artículo) de
     cualquier lista de islas o municipios. No toca el orden original, que se
     conserva por si algo depende de él (ninguna parte del cálculo lo hace,
     pero el orden de origen sigue siendo el del código INE). */
  function ordenarPorNombre(lista) {
    return lista.slice().sort(function (a, b) { return compararNombres(a.nombre, b.nombre); });
  }

  /* Devuelve '35', '38' o null si el texto no identifica ninguna provincia. */
  function provinciaDeTexto(valor) {
    var norm = normaliza(valor);
    if (!norm) { return null; }
    var encontrada = null;
    Object.keys(ALIAS_PROVINCIA).forEach(function (id) {
      if (ALIAS_PROVINCIA[id].indexOf(norm) >= 0) { encontrada = id; }
    });
    return encontrada;
  }

  /* Cuando una celda trae código y nombre juntos ("35001 AGAETE"), comprueba que
     se refieran al mismo municipio. Un desajuste significa que el fichero sigue
     otra codificación, y hay que avisar: importar por código sin más ruido
     colgaría los datos del municipio equivocado en silencio. */
  function discrepancia(valor, codigo) {
    var txt = String(valor == null ? '' : valor).trim();
    var resto = txt.replace(/\d{5}/, '').replace(/^[\s\-.:;,]+/, '').trim();
    if (!resto || !porCodigo[codigo]) { return null; }

    var esperadas = variantes(porCodigo[codigo].nombre);
    var recibida = normaliza(resto);
    if (!recibida) { return null; }
    if (esperadas.indexOf(recibida) >= 0) { return null; }

    return {
      texto: txt,
      codigo: codigo,
      nombreEsperado: porCodigo[codigo].nombre
    };
  }

  App.geo = {
    PROVINCIAS: PROVINCIAS,
    ISLAS: ISLAS,
    MUNICIPIOS: MUNICIPIOS,
    municipio: function (codigo) { return porCodigo[codigo] || null; },
    isla: function (id) { return islaPorId[id] || null; },
    provincia: function (id) {
      for (var i = 0; i < PROVINCIAS.length; i++) {
        if (PROVINCIAS[i].id === id) { return PROVINCIAS[i]; }
      }
      return null;
    },
    islasDe: function (provinciaId) {
      return ISLAS.filter(function (i) { return i.provincia === provinciaId; });
    },
    municipiosDe: function (islaId) {
      return MUNICIPIOS.filter(function (m) { return m.isla === islaId; });
    },
    normaliza: normaliza,
    resolverMunicipio: resolverMunicipio,
    discrepancia: discrepancia,
    provinciaDeTexto: provinciaDeTexto,
    ordenarPorNombre: ordenarPorNombre,
    compararNombres: compararNombres
  };
})(window.App = window.App || {});

/* ===== 05-api.js ===== */
/* Comunicación con el servidor y sesión de Google.
   La aplicación funciona en dos modos:
     - «servidor»: hay API detrás, hace falta iniciar sesión y los datos viven
       en la base de datos, compartidos entre dispositivos.
     - «local»: no hay API (fichero abierto directamente, vista previa). Los
       datos se quedan en este navegador y se avisa de ello.
   El modo se detecta al arrancar, no se configura. */
(function (App) {
  'use strict';

  var GUION_GOOGLE = 'https://accounts.google.com/gsi/client';
  var CLAVE_CREDENCIAL = 'gastos-electorales:credencial';

  var estado = {
    modo: null,        // 'servidor' | 'local'
    clienteId: null,
    aviso: null,
    sesion: null,      // { correo, nombre, foto }
    credencial: null,
    version: null      // { commit, revision } — null en modo local
  };

  function recordarCredencial(valor) {
    estado.credencial = valor;
    try {
      if (valor) { window.sessionStorage.setItem(CLAVE_CREDENCIAL, valor); }
      else { window.sessionStorage.removeItem(CLAVE_CREDENCIAL); }
    } catch (e) { /* sin sessionStorage la sesión dura lo que la pestaña */ }
  }

  function recuperarCredencial() {
    try { return window.sessionStorage.getItem(CLAVE_CREDENCIAL); }
    catch (e) { return null; }
  }

  function peticion(ruta, opciones) {
    opciones = opciones || {};
    var cabeceras = { 'Content-Type': 'application/json' };
    if (estado.credencial) {
      cabeceras.Authorization = 'Bearer ' + estado.credencial;
    }
    return fetch(ruta, {
      method: opciones.metodo || 'GET',
      headers: cabeceras,
      body: opciones.cuerpo ? JSON.stringify(opciones.cuerpo) : undefined
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (cuerpo) {
        if (r.ok) { return cuerpo; }
        var err = new Error(cuerpo.error || ('Error ' + r.status));
        err.estado = r.status;
        err.cuerpo = cuerpo;
        throw err;
      });
    });
  }

  /* Averigua si hay servidor detrás. Un fallo de red aquí no es un error:
     significa que la aplicación se está usando suelta. */
  function detectarModo() {
    /* Un fichero abierto directamente nunca tiene API detrás, y preguntar por
       ella sólo ensucia la consola con un error de CORS. */
    if (window.location.protocol === 'file:') {
      estado.modo = 'local';
      return Promise.resolve(estado);
    }

    return fetch('/api/configuracion', { headers: { Accept: 'application/json' } })
      .then(function (r) {
        if (!r.ok) { throw new Error('sin api'); }
        return r.json();
      })
      .then(function (cfg) {
        estado.modo = 'servidor';
        estado.clienteId = cfg.clienteId;
        estado.aviso = cfg.aviso;
        estado.modoAuth = cfg.modo;
        estado.configurado = cfg.configurado === true;
        estado.version = cfg.version || null;
        estado.credencial = recuperarCredencial();
        return estado;
      })
      .catch(function () {
        estado.modo = 'local';
        return estado;
      });
  }

  /* Carga el script de Google una sola vez. */
  var promesaGoogle = null;
  function cargarGoogle() {
    if (promesaGoogle) { return promesaGoogle; }
    promesaGoogle = new Promise(function (resolve, reject) {
      if (window.google && window.google.accounts) { return resolve(); }
      var s = document.createElement('script');
      s.src = GUION_GOOGLE;
      s.async = true;
      s.defer = true;
      s.onload = resolve;
      s.onerror = function () {
        reject(new Error('No se pudo cargar el acceso de Google. Compruebe la conexión.'));
      };
      document.head.appendChild(s);
    });
    return promesaGoogle;
  }

  /* Pinta el botón oficial de Google dentro del contenedor indicado. */
  function pintarBotonAcceso(contenedor, alEntrar, alFallar) {
    cargarGoogle().then(function () {
      window.google.accounts.id.initialize({
        client_id: estado.clienteId,
        callback: function (respuesta) {
          recordarCredencial(respuesta.credential);
          verificarSesion().then(alEntrar).catch(alFallar);
        }
      });
      window.google.accounts.id.renderButton(contenedor, {
        theme: 'filled_blue',
        size: 'large',
        text: 'signin_with',
        locale: 'es',
        width: 280
      });
    }).catch(alFallar);
  }

  function verificarSesion() {
    return peticion('/api/sesion').then(function (s) {
      estado.sesion = s;
      return s;
    });
  }

  function cerrarSesion() {
    recordarCredencial(null);
    estado.sesion = null;
    try {
      if (window.google && window.google.accounts) {
        window.google.accounts.id.disableAutoSelect();
      }
    } catch (e) { /* da igual si Google no está cargado */ }
  }

  App.api = {
    estado: function () { return estado; },
    detectarModo: detectarModo,
    pintarBotonAcceso: pintarBotonAcceso,
    verificarSesion: verificarSesion,
    cerrarSesion: cerrarSesion,
    leerEstado: function () { return peticion('/api/estado'); },
    guardarEstado: function (version, datos) {
      return peticion('/api/estado', { metodo: 'PUT', cuerpo: { version: version, datos: datos } });
    },
    listarUsuarios: function () { return peticion('/api/usuarios'); },
    darAcceso: function (correo) {
      return peticion('/api/usuarios', { metodo: 'POST', cuerpo: { correo: correo } });
    },
    quitarAcceso: function (correo) {
      return peticion('/api/usuarios', { metodo: 'DELETE', cuerpo: { correo: correo } });
    }
  };
})(window.App = window.App || {});

/* ===== 10-state.js ===== */
/* Estado de la aplicación y su persistencia.
   En modo servidor los datos viven en la base de datos y se comparten entre
   dispositivos; el navegador guarda una copia que sirve de respaldo si se cae
   la conexión. En modo local el navegador es el único almacén.
   La interfaz (estado / muta / suscribir) es la misma en ambos casos, de modo
   que las vistas no saben de dónde vienen los datos. */
(function (App) {
  'use strict';

  var CLAVE = 'gastos-electorales:v1';
  var ESPERA_GUARDADO = 800; // ms de calma antes de mandar al servidor

  /* Tipologías de colaborador. El orden manda en la UI y en los informes.
     `agregable: false` marca los conceptos que, por decisión de negocio, no se
     suman al reparto territorial. */
  var COLABORADORES = [
    { id: 'representantes', nombre: 'Representantes de la Administración', agregable: true },
    { id: 'secretarios', nombre: 'Secretarios de Ayuntamiento', agregable: true },
    { id: 'juecesPaz', nombre: 'Jueces de Paz', agregable: true },
    { id: 'acondicionamiento', nombre: 'Acondicionamiento de locales', agregable: true },
    { id: 'personalColaborador', nombre: 'Personal colaborador', agregable: true },
    { id: 'montajeTransporte', nombre: 'Montaje y transporte', agregable: true },
    { id: 'policia', nombre: 'Policía Autonómica y Local', agregable: true },
    { id: 'miembrosMesa', nombre: 'Miembros de mesas electorales', agregable: true },
    { id: 'coordinadores', nombre: 'Coordinadores de tablets', agregable: false }
  ];

  var TIPOLOGIAS_PD = ['PD0', 'PD1', 'PD2', 'PD3', 'PD4', 'PD5'];

  function configPorDefecto() {
    return {
      representantes: { PD0: 130, PD1: 170, PD2: 190, PD3: 210, PD4: 230, PD5: 250 },
      secretarios: { hasta10: 100, de11a50: 180, mas50: 250 },
      juecesPaz: 45,
      acondicionamiento: 60,
      personalColaborador: 85,
      montajeTransporte: 110,
      policia: 90,
      miembrosMesa: 70,
      /* Miembros por mesa. El briefing fija 3; se deja configurable porque es
         el tipo de constante que cambia entre convocatorias. */
      miembrosPorMesa: 3,
      coordinadores: { tarifaHasta10: 120, tarifaDesde11: 140, numHasta10: 0, numDesde11: 0 }
    };
  }

  function estadoPorDefecto() {
    return {
      version: 1,
      convocatoria: 'Proceso electoral',
      config: configPorDefecto(),
      mesas: {},            // codigo -> nº de mesas
      representantes: {},   // codigo -> { PD0: n, ... }
      policia: {},          // codigo -> nº de efectivos
      cargas: {}            // censo -> { fecha, fichero, filas }
    };
  }

  /* Mezcla lo guardado sobre los valores por defecto, para que una versión que
     añada un campo nuevo no rompa unos datos antiguos. */
  function fusiona(base, guardado) {
    if (!guardado || typeof guardado !== 'object') { return base; }
    Object.keys(guardado).forEach(function (k) {
      var v = guardado[k];
      if (v && typeof v === 'object' && !Array.isArray(v) &&
          base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) {
        fusiona(base[k], v);
      } else if (v !== undefined && v !== null) {

/* Motor de cálculo de gastos.
   Todo el dinero se calcula aquí y en ningún otro sitio: las vistas sólo pintan
   lo que devuelven estas funciones. */
(function (App) {
  'use strict';

  var PD = App.store.TIPOLOGIAS_PD;

  /* Un municipio se considera activo cuando tiene mesas cargadas. Los conceptos
     que se cobran "por municipio" (secretario, juez de paz) sólo devengan en los
     municipios activos: sin mesas no hay proceso electoral que atender. */
  function estaActivo(estado, codigo) {
    return (Number(estado.mesas[codigo]) || 0) > 0;
  }

  function tramoSecretario(cfg, mesas) {
    if (mesas <= 0) { return 0; }
    if (mesas <= 10) { return Number(cfg.secretarios.hasta10) || 0; }
    if (mesas <= 50) { return Number(cfg.secretarios.de11a50) || 0; }
    return Number(cfg.secretarios.mas50) || 0;
  }

  /* Desglose de un municipio: importe y "cantidad" (la magnitud sobre la que se
     calcula) por cada tipología agregable. */
  function calcularMunicipio(estado, codigo) {
    var cfg = estado.config;
    var mesas = Number(estado.mesas[codigo]) || 0;
    var efectivos = Number(estado.policia[codigo]) || 0;
    var reps = estado.representantes[codigo] || {};
    var activo = mesas > 0;

    var nRepresentantes = 0;
    var importeRepresentantes = 0;
    PD.forEach(function (t) {
      var n = Number(reps[t]) || 0;
      nRepresentantes += n;
      importeRepresentantes += n * (Number(cfg.representantes[t]) || 0);
    });

    var lineas = {
      representantes: {
        cantidad: nRepresentantes,
        unidad: 'representantes',
        importeUnitario: nRepresentantes ? importeRepresentantes / nRepresentantes : 0,
        importe: importeRepresentantes
      },
      secretarios: {
        cantidad: activo ? 1 : 0,
        unidad: 'secretarios',
        importeUnitario: tramoSecretario(cfg, mesas),
        importe: activo ? tramoSecretario(cfg, mesas) : 0
      },
      juecesPaz: {
        cantidad: activo ? 1 : 0,
        unidad: 'jueces',
        importeUnitario: Number(cfg.juecesPaz) || 0,
        importe: activo ? (Number(cfg.juecesPaz) || 0) : 0
      },
      acondicionamiento: {
        cantidad: mesas,
        unidad: 'mesas',
        importeUnitario: Number(cfg.acondicionamiento) || 0,
        importe: mesas * (Number(cfg.acondicionamiento) || 0)
      },
      personalColaborador: {
        cantidad: mesas,
        unidad: 'mesas',
        importeUnitario: Number(cfg.personalColaborador) || 0,
        importe: mesas * (Number(cfg.personalColaborador) || 0)
      },
      montajeTransporte: {
        cantidad: mesas,
        unidad: 'mesas',
        importeUnitario: Number(cfg.montajeTransporte) || 0,
        importe: mesas * (Number(cfg.montajeTransporte) || 0)
      },
      policia: {
        cantidad: efectivos,
        unidad: 'efectivos',
        importeUnitario: Number(cfg.policia) || 0,
        importe: efectivos * (Number(cfg.policia) || 0)
      },
      miembrosMesa: {
        cantidad: mesas * (Number(cfg.miembrosPorMesa) || 0),
        unidad: 'miembros',
        importeUnitario: Number(cfg.miembrosMesa) || 0,
        importe: mesas * (Number(cfg.miembrosPorMesa) || 0) * (Number(cfg.miembrosMesa) || 0)
      }
    };

    return {
      codigo: codigo,
      mesas: mesas,
      efectivos: efectivos,
      activo: activo,
      representantesPorTipo: reps,
      lineas: lineas
    };
  }

  /* Los coordinadores de tablets viven fuera del reparto territorial: se
     configuran como totales y se informan aparte. */
  function calcularCoordinadores(estado) {
    var c = estado.config.coordinadores || {};
    var nA = Number(c.numHasta10) || 0;
    var nB = Number(c.numDesde11) || 0;
    var tA = Number(c.tarifaHasta10) || 0;
    var tB = Number(c.tarifaDesde11) || 0;
    return {
      hasta10: { cantidad: nA, importeUnitario: tA, importe: nA * tA },
      desde11: { cantidad: nB, importeUnitario: tB, importe: nB * tB },
      total: nA * tA + nB * tB
    };
  }

  /* Aplica los filtros del informe y devuelve los códigos de municipio en ámbito.
     filtros = { provincias: [], islas: [], municipios: [], soloActivos: bool } */
  function municipiosEnAmbito(estado, filtros) {
    return App.geo.ordenarPorNombre(App.geo.MUNICIPIOS).filter(function (m) {
      if (filtros.provincias && filtros.provincias.length &&
          filtros.provincias.indexOf(m.provincia) < 0) { return false; }
      if (filtros.islas && filtros.islas.length &&
          filtros.islas.indexOf(m.isla) < 0) { return false; }
      if (filtros.municipios && filtros.municipios.length &&
          filtros.municipios.indexOf(m.codigo) < 0) { return false; }
      if (filtros.soloActivos && !estaActivo(estado, m.codigo)) { return false; }
      return true;
    }).map(function (m) { return m.codigo; });
  }

  /* Construye el informe completo para un ámbito y una selección de tipologías. */
  function generarInforme(estado, filtros, tiposSeleccionados) {
    var codigos = municipiosEnAmbito(estado, filtros);
    var tipos = tiposSeleccionados || [];

    var porMunicipio = [];
    var totalPorTipo = {};
    var cantidadPorTipo = {};
    App.store.COLABORADORES.forEach(function (c) {
      totalPorTipo[c.id] = 0;
      cantidadPorTipo[c.id] = 0;
    });

    var totalGeneral = 0;
    var totalMesas = 0;
    var municipiosActivos = 0;

    codigos.forEach(function (codigo) {
      var det = calcularMunicipio(estado, codigo);
      var geo = App.geo.municipio(codigo);
      var subtotal = 0;
      var lineasFiltradas = {};

      Object.keys(det.lineas).forEach(function (tipo) {
        if (tipos.indexOf(tipo) < 0) { return; }
        var l = det.lineas[tipo];
        lineasFiltradas[tipo] = l;
        subtotal += l.importe;
        totalPorTipo[tipo] += l.importe;
        cantidadPorTipo[tipo] += l.cantidad;
      });

      totalMesas += det.mesas;
      if (det.activo) { municipiosActivos += 1; }
      totalGeneral += subtotal;

      porMunicipio.push({
        codigo: codigo,
        nombre: geo.nombre,
        isla: geo.isla,
        islaNombre: App.geo.isla(geo.isla).nombre,
        provincia: geo.provincia,
        provinciaNombre: App.geo.provincia(geo.provincia).nombre,
        mesas: det.mesas,
        efectivos: det.efectivos,
        activo: det.activo,
        lineas: lineasFiltradas,
        subtotal: subtotal
      });
    });

    /* Agregados territoriales, calculados sobre los municipios ya filtrados. */
    function agrupar(clave, nombreClave) {
      var mapa = {};
      porMunicipio.forEach(function (m) {
        var k = m[clave];
        if (!mapa[k]) {
          mapa[k] = { id: k, nombre: m[nombreClave], importe: 0, mesas: 0, municipios: 0 };
        }
        mapa[k].importe += m.subtotal;
        mapa[k].mesas += m.mesas;
        mapa[k].municipios += 1;
      });
      return Object.keys(mapa).map(function (k) { return mapa[k]; })
        .sort(function (a, b) { return b.importe - a.importe; });
    }

    var coordinadores = calcularCoordinadores(estado);
    var incluyeCoordinadores = tipos.indexOf('coordinadores') >= 0;

    return {
      generadoEn: new Date(),
      filtros: filtros,
      tipos: tipos,
      porMunicipio: porMunicipio,
      porIsla: agrupar('isla', 'islaNombre'),
      porProvincia: agrupar('provincia', 'provinciaNombre'),
      totalPorTipo: totalPorTipo,
      cantidadPorTipo: cantidadPorTipo,
      totalMesas: totalMesas,
      municipiosEnAmbito: codigos.length,
      municipiosActivos: municipiosActivos,
      /* Total territorial: la suma de todo lo que se reparte por municipio. */
      totalTerritorial: totalGeneral,
      coordinadores: coordinadores,
      incluyeCoordinadores: incluyeCoordinadores,
      /* Total general: territorial + coordinadores, que van aparte por diseño. */
      total: totalGeneral + (incluyeCoordinadores ? coordinadores.total : 0)
    };
  }

  App.calc = {
    calcularMunicipio: calcularMunicipio,
    calcularCoordinadores: calcularCoordinadores,
    municipiosEnAmbito: municipiosEnAmbito,
    tramoSecretario: tramoSecretario,
    generarInforme: generarInforme
  };
})(window.App = window.App || {});

        else if (k === 'text') { nodo.textContent = v; }
        else if (k === 'html') { nodo.innerHTML = v; }

/* Vista "Carga de Datos": los censos que alimentan los cálculos.
   Un mismo fichero puede traer varios censos, así que hay una sola zona de carga
   que detecta por la cabecera qué contiene y actualiza lo que corresponda. */
(function (App) {
  'use strict';

  var el = App.ui.el;
  var icono = App.ui.icono;

  var CENSOS = [
    {
      id: 'mesas',
      titulo: 'Mesas por municipio',
      icono: 'mesa',
      columnas: 'MESAS',
      descripcion: 'Base de casi todos los cálculos: acondicionamiento, personal, montaje, miembros de mesa y el tramo del secretario.',
      mapa: function (s) { return s.mesas; },
      fijar: function (s, m) { s.mesas = m; }
    },
    {
      id: 'representantes',
      titulo: 'Representantes de la Administración',
      icono: 'grupo',
      columnas: 'PD0 … PD5',
      descripcion: 'Número de representantes de cada tipología. Cada uno cobra según su tipología.',
      mapa: function (s) { return s.representantes; },
      fijar: function (s, m) { s.representantes = m; }
    },
    {
      id: 'policia',
      titulo: 'Efectivos de policía',
      icono: 'escudo',
      columnas: 'EFECTIVOS',
      descripcion: 'Efectivos de Policía Autonómica y Local por municipio. Suele llegar en un fichero aparte.',
      mapa: function (s) { return s.policia; },
      fijar: function (s, m) { s.policia = m; }
    }
  ];

  function censo(id) {
    for (var i = 0; i < CENSOS.length; i++) {
      if (CENSOS[i].id === id) { return CENSOS[i]; }
    }
    return null;
  }

  function cuantos(id) {
    return Object.keys(censo(id).mapa(App.store.estado()) || {}).length;
  }

  /* Resultado de la última importación, fuera del DOM: el repintado que sigue a
     la carga se llevaría por delante cualquier aviso guardado en el nodo. */
  var ultima = null;

  /* ---------- Importación ---------- */

  function importar(file) {
    ultima = { leyendo: true, fichero: file.name };
    App.render();

    App.parsers.leerFichero(file)
      .then(function (filas) {
        var res = App.parsers.interpretarFicheroDatos(filas);

        var resumen = res.bloques.map(function (b) {
          var previos = censo(b.id).mapa(App.store.estado()) || {};
          var nuevos = 0;
          Object.keys(b.datos).forEach(function (c) {
            if (previos[c] === undefined) { nuevos += 1; }
          });
          return {
            id: b.id, nombre: b.nombre, municipios: b.municipios,
            nuevos: nuevos, actualizados: b.municipios - nuevos
          };
        });

        /* Se fusiona en vez de reemplazar: así un fichero por provincia se puede
           cargar en dos veces sin que el segundo borre al primero. Para empezar
           de cero está el botón de borrar de cada censo. */
        App.store.muta(function (s) {
          res.bloques.forEach(function (b) {
            var c = censo(b.id);
            var mezcla = {};
            var actual = c.mapa(s) || {};
            Object.keys(actual).forEach(function (k) { mezcla[k] = actual[k]; });
            Object.keys(b.datos).forEach(function (k) { mezcla[k] = b.datos[k]; });
            c.fijar(s, mezcla);
            s.cargas[b.id] = {
              fecha: new Date().toISOString(),
              fichero: file.name,
              filas: b.municipios
            };
          });
        });

        ultima = { fichero: file.name, res: res, resumen: resumen };
        App.ui.flotante(
          resumen.map(function (r) { return r.nombre.toLowerCase(); }).join(' y ') +
          ' actualizados desde ' + file.name
        );
        App.render();
      })
      .catch(function (err) {
        console.error(err);
        ultima = { fichero: file.name, error: err.message };
        App.ui.flotante('No se pudo importar ' + file.name, true);
        App.render();
      });
  }

  /* ---------- Zona de carga ---------- */

    var input = el('input', {
      type: 'file',
      accept: '.csv,.tsv,.txt,.xlsx',
      onChange: function (e) {
        if (e.target.files && e.target.files[0]) { importar(e.target.files[0]); }

      }

      class: 'zona-carga grande',
      tabindex: '0',
      role: 'button',
      'aria-label': 'Cargar fichero de datos',

      onKeydown: function (e) {

      },

      onDragleave: function () { zona.classList.remove('encima'); },
      onDrop: function (e) {

      }
    }, [
      el('div', { class: 'icono-zona' }, [icono('carga', 26)]),
      el('h3', { text: 'Arrastre aquí el CSV o Excel, o pulse para seleccionarlo' }),
      el('p', {
        class: 'pista',
        text: 'Un mismo fichero puede traer varios censos: se detectan por la cabecera y se cargan de una vez.'
      }),
      input
    ]);

    return el('section', { class: 'tarjeta' }, [
      el('header', {}, [
        el('h2', {}, [icono('carga'), 'Cargar datos']),
        el('button', {
          class: 'btn secundario pequeno',
          onClick: descargarPlantillas
        }, [icono('descarga', 14), 'Plantillas CSV'])
      ]),
      zona,
      el('div', { class: 'rejilla tres', style: 'margin-top:20px' }, CENSOS.map(function (c) {
        return el('div', { class: 'columna-reconocida' }, [
          el('div', { class: 'fila' }, [
            icono(c.icono, 16),
            el('strong', { text: c.titulo })
          ]),
          el('code', { class: 'cabecera-esperada', text: c.columnas }),
          el('p', { class: 'silencio', text: c.descripcion })
        ]);
      })),
      el('p', {
        class: 'leyenda-nota',
        text: 'La columna de municipios debe llamarse MUNICIPIOS (o CÓDIGO / NOMBRE) y admite «35001», «AGAETE» o «35001 AGAETE». ' +
          'Las columnas que no se reconocen se ignoran sin estorbar; si hay una PROVINCIA, se usa para comprobar que concuerda con el código. ' +
          'Los municipios del fichero se actualizan y el resto se conserva, de modo que se puede cargar una provincia hoy y la otra mañana. ' +
          'Si el fichero trae una fila de TOTALES, se usa para comprobar que lo importado cuadra.'
      })
    ]);
  }

  /* ---------- Avisos de la última importación ---------- */

  function tarjetaResultado() {

    if (ultima.leyendo) {

/* Vista "Dashboard de Informes": filtros, indicadores, gráficas y tablas. */
(function (App) {
  'use strict';

  var el = App.ui.el;
  var icono = App.ui.icono;
  var euro = App.ui.euro;
  var numero = App.ui.numero;

  /* Los filtros viven en memoria durante la sesión: son una consulta, no un dato
     del proceso electoral, así que no se persisten con el resto del estado. */
  var filtros = null;

  function filtrosPorDefecto() {
    return {
      provincias: App.geo.PROVINCIAS.map(function (p) { return p.id; }),
      islas: App.geo.ISLAS.map(function (i) { return i.id; }),
      municipios: App.geo.MUNICIPIOS.map(function (m) { return m.codigo; }),
      tipos: App.store.COLABORADORES.map(function (c) { return c.id; }),
      soloActivos: true,
      busquedaMunicipio: '',
      busquedaTabla: '',
      pestana: 'municipio',
      /* Orden de la tabla de desglose, por pestaña: { columna, direccion }.
         Sin entrada para una pestaña se usa su orden por defecto. */
      orden: {}
    };
  }

  function estadoFiltros() {
    if (!filtros) { filtros = filtrosPorDefecto(); }
    return filtros;
  }

  /* ---------- Controles de selección ---------- */

  function alterna(lista, valor, activo) {
    var i = lista.indexOf(valor);
    if (activo && i < 0) { lista.push(valor); }
    if (!activo && i >= 0) { lista.splice(i, 1); }
  }

  function checklist(opciones) {
    var f = estadoFiltros();
    var lista = el('div', { class: 'lista-check' + (opciones.corta ? ' corta' : '') });

    opciones.items.forEach(function (item) {
      var marcado = opciones.seleccion.indexOf(item.id) >= 0;
      lista.appendChild(el('label', { class: 'opcion-check' }, [

          type: 'checkbox',

          onChange: function (e) {
            opciones.alCambiar(item.id, e.target.checked);
            App.render();
          }
        }),
        el('span', { class: 'texto', text: item.nombre }),
        item.meta ? el('span', { class: 'meta', text: item.meta }) : null
      ]));
    });

    if (!opciones.items.length) {
      lista.appendChild(el('p', { class: 'silencio', style: 'padding:12px', text: 'Nada que mostrar con la selección de arriba.' }));
    }

    var bloque = el('div', { class: 'grupo-filtro' }, [
      el('div', { class: 'titulo-filtro' }, [
        el('strong', { text: opciones.titulo }),
        el('span', {
          class: 'cuenta',
          text: opciones.seleccion.filter(function (id) {
            return opciones.items.some(function (it) { return it.id === id; });
          }).length + ' / ' + opciones.items.length
        })
      ]),
      el('div', { class: 'acciones-filtro' }, [

        }, 'Ninguno')
      ])
    ]);

    if (opciones.buscador) {
      bloque.appendChild(el('input', {
        type: 'search',
        placeholder: 'Buscar municipio…',
        value: f.busquedaMunicipio,
        style: 'margin-bottom:8px',
        onInput: function (e) {
          f.busquedaMunicipio = e.target.value;
          App.render({ foco: 'buscador-municipio' });

      }));

    bloque.appendChild(lista);

  }

  function panelFiltros() {

    var islasVisibles = App.geo.ordenarPorNombre(App.geo.ISLAS.filter(function (i) {
      return f.provincias.indexOf(i.provincia) >= 0;
    }));

      if (f.islas.indexOf(m.isla) < 0) { return false; }

      if (termino && App.geo.normaliza(m.nombre).indexOf(termino) < 0 &&

      return true;
    }));

    /* Al desmarcar un ámbito superior se arrastra lo que cuelga de él, para que

    function cascadaProvincia(id, activo) {

        alterna(f.islas, isla.id, activo);

        });

    function cascadaIsla(id, activo) {

      el('div', { class: 'entre' }, [

        seleccion: f.provincias,
        corta: true,
        alCambiar: cascadaProvincia,
        alTodos: function (v) {
