<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#00346f">
<meta name="description" content="Cálculo, listados e informes de los gastos de colaboradores de un proceso electoral en Canarias.">
<title>Gestión Electoral — Gastos de colaboradores</title>
<style>
/* Sistema visual "Civic Authority" — tomado del prototipo de Stitch.
   Es un diseño institucional que se compromete deliberadamente con el modo claro:
   la neutralidad y la previsibilidad importan más aquí que adaptarse al tema del
   dispositivo, así que se fija color-scheme y no se ofrece variante oscura. */
:root {
  color-scheme: light;

  --primary: #00346f;
  --primary-container: #004a99;
  --surface-tint: #255dad;
  --on-primary: #ffffff;
  --secondary: #505f76;
  --secondary-container: #d0e1fb;

  --background: #f9f9ff;
  --surface: #ffffff;
  --surface-low: #f3f3fa;
  --surface-container: #ededf5;

  --on-surface: #191c21;
  --on-surface-variant: #424751;
  --muted: #737783;
  --outline: #c2c6d3;
  --outline-strong: #a9aebc;

  --error: #ba1a1a;
  --error-container: #ffdad6;
  --good: #0f7a3d;
  --good-container: #d8f2e3;
  --warning-container: #fdefd2;
  --on-warning-container: #6b4a04;

  --serie: #255dad;
  --serie-suave: #b7d3f6;
  --gridline: #e6e7ee;

  --radio: 4px;
  --radio-lg: 8px;
  --sombra: 0 4px 12px rgba(0, 0, 0, 0.04);
  --sombra-flotante: 0 4px 12px rgba(0, 0, 0, 0.08);

  --sidebar: 268px;
  --filtros: 300px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 14px;
  line-height: 1.5;
  color: var(--on-surface);
  background: var(--background);
  -webkit-text-size-adjust: 100%;
}

h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
h1 { font-size: 32px; line-height: 1.25; }
h2 { font-size: 20px; }
h3 { font-size: 15px; }
p { margin: 0; }

button { font: inherit; cursor: pointer; }
a { color: var(--primary-container); }

.num { font-variant-numeric: tabular-nums; }

/* ---------- Armazón ---------- */

.app { display: flex; min-height: 100vh; }

.topbar {
  position: sticky; top: 0; z-index: 30;
  display: none;
  align-items: center; gap: 12px;
  padding: 10px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--outline);
}
.topbar strong { color: var(--primary); font-size: 16px; }

.sidebar {
  width: var(--sidebar);
  flex: 0 0 var(--sidebar);
  background: var(--surface);
  border-right: 1px solid var(--outline);
  padding: 24px 16px;
  display: flex; flex-direction: column; gap: 24px;
  position: sticky; top: 0; height: 100vh;
}
.marca-titulo { color: var(--primary); font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.marca-sub {
  color: var(--muted); font-size: 11px; font-weight: 600;
  letter-spacing: 0.08em; text-transform: uppercase; margin-top: 2px;
}

.nav { display: flex; flex-direction: column; gap: 4px; }
.nav button {
  display: flex; align-items: center; gap: 12px;
  width: 100%; text-align: left;
  padding: 10px 12px;
  border: 0; border-radius: var(--radio);
  background: transparent; color: var(--on-surface-variant);
  font-weight: 500;
}
.nav button:hover { background: var(--surface-low); }
.nav button[aria-current="page"] {
  background: var(--secondary-container);
  color: var(--primary); font-weight: 600;
}
.nav .ico { width: 20px; flex: 0 0 20px; opacity: 0.85; }

.principal { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.contenido { flex: 1; padding: 32px; max-width: 1400px; width: 100%; }

.cabecera-pagina { margin-bottom: 28px; }
.cabecera-pagina p { color: var(--on-surface-variant); margin-top: 6px; font-size: 15px; }

.pie {
  border-top: 1px solid var(--outline);
  padding: 16px 32px;
  color: var(--muted); font-size: 12px;
  display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
}

/* ---------- Piezas ---------- */

.tarjeta {
  background: var(--surface);
  border: 1px solid var(--outline);
  border-radius: var(--radio-lg);
  box-shadow: var(--sombra);
  padding: 24px;
}
.tarjeta > header {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; flex-wrap: wrap;
  padding-bottom: 14px; margin-bottom: 20px;
  border-bottom: 1px solid var(--outline);
}
.tarjeta > header h2 { color: var(--primary); display: flex; align-items: center; gap: 10px; }

.rejilla { display: grid; gap: 24px; }
.rejilla.dos { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.rejilla.tres { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.rejilla.cuatro { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.rejilla.principal-lateral { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }

.kpi { display: flex; flex-direction: column; gap: 6px; }
.kpi .etiqueta {
  font-size: 11px; font-weight: 600; letter-spacing: 0.07em;
  text-transform: uppercase; color: var(--muted);
}
.kpi .valor {
  font-size: clamp(22px, 1.9vw, 28px);
  font-weight: 700; letter-spacing: -0.02em;
  white-space: nowrap;
}
.kpi .valor.destacado { color: var(--primary); }
.kpi .nota { font-size: 12px; color: var(--on-surface-variant); }

label { display: block; font-size: 12px; font-weight: 600; color: var(--on-surface-variant); margin-bottom: 6px; }

input[type="text"], input[type="number"], input[type="search"], select {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid var(--outline);
  border-radius: var(--radio);
  background: var(--surface);
  color: var(--on-surface);
  font: inherit;
}
input:focus-visible, select:focus-visible, button:focus-visible, .zona-carga:focus-visible {
  outline: 2px solid var(--surface-tint);
  outline-offset: 1px;
}
input[type="number"] { text-align: right; font-variant-numeric: tabular-nums; }

.campo-euro { position: relative; }
.campo-euro input { padding-right: 30px; }
.campo-euro::after {
  content: "€"; position: absolute; right: 11px; top: 50%; transform: translateY(-50%);
  color: var(--muted); pointer-events: none;
}

.campo { margin-bottom: 0; }
.campo-linea {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 14px;
  background: var(--surface-low);
  border: 1px solid var(--outline);
  border-radius: var(--radio);
}
.campo-linea label { margin: 0; font-size: 13px; font-weight: 500; color: var(--on-surface); }
.campo-linea .campo-euro { width: 116px; flex: 0 0 116px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 18px;
  border-radius: var(--radio);
  border: 1px solid transparent;
  font-weight: 600; font-size: 14px;
  background: var(--primary); color: var(--on-primary);
}
.btn:hover { background: var(--primary-container); }
.btn.secundario { background: var(--surface); color: var(--primary); border-color: var(--outline-strong); }
.btn.secundario:hover { background: var(--surface-low); }
.btn.fantasma { background: transparent; color: var(--on-surface-variant); border-color: transparent; }
.btn.fantasma:hover { background: var(--surface-low); }
.btn.peligro { background: transparent; color: var(--error); border-color: var(--outline); }
.btn.peligro:hover { background: var(--error-container); }
.btn.pequeno { padding: 6px 11px; font-size: 12px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 9px; border-radius: 999px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.03em;
}
.chip.ok { background: var(--good-container); color: var(--good); }
.chip.pendiente { background: var(--surface-container); color: var(--on-surface-variant); }
.chip.aviso { background: var(--warning-container); color: var(--on-warning-container); }

.aviso {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 14px 16px; border-radius: var(--radio);
  background: var(--warning-container); color: var(--on-warning-container);
  font-size: 13px; line-height: 1.55;
}
.aviso.error { background: var(--error-container); color: var(--error); }
.aviso.ok { background: var(--good-container); color: var(--good); }
.aviso .ico { flex: 0 0 20px; }

/* ---------- Filtros ---------- */

.panel-filtros {
  width: var(--filtros); flex: 0 0 var(--filtros);
  background: var(--surface);
  border-right: 1px solid var(--outline);
  padding: 24px 20px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  display: flex; flex-direction: column; gap: 22px;
}
.panel-filtros h2 {
  font-size: 12px; font-weight: 700; letter-spacing: 0.09em;
  text-transform: uppercase; color: var(--on-surface-variant);
}

.grupo-filtro > .titulo-filtro {
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  margin-bottom: 8px;
}
.titulo-filtro strong { font-size: 13px; font-weight: 600; }
.titulo-filtro .cuenta { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

.acciones-filtro { display: flex; gap: 6px; margin-bottom: 8px; }
.acciones-filtro button {
  flex: 1; padding: 5px 8px; font-size: 11px; font-weight: 600;
  border: 1px solid var(--outline); border-radius: var(--radio);
  background: var(--surface); color: var(--primary);
}
.acciones-filtro button:hover { background: var(--secondary-container); }

.lista-check {
  max-height: 216px; overflow-y: auto;
  border: 1px solid var(--outline); border-radius: var(--radio);
  background: var(--surface);
}
.lista-check.corta { max-height: none; }
.opcion-check {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 11px;
  font-size: 13px; cursor: pointer;
  border-bottom: 1px solid var(--surface-low);
}
.opcion-check:last-child { border-bottom: 0; }
.opcion-check:hover { background: var(--surface-low); }
.opcion-check input { accent-color: var(--primary); width: 15px; height: 15px; flex: 0 0 15px; margin: 0; }
.opcion-check .texto { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.opcion-check .meta { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.opcion-check.desactivada { opacity: 0.4; pointer-events: none; }

/* ---------- Gráficas ---------- */

.gr-barras { display: flex; flex-direction: column; gap: 10px; }
.gr-fila {
  display: grid;
  grid-template-columns: minmax(110px, 244px) minmax(40px, 1fr) auto;
  gap: 12px; align-items: center;
}
.gr-etiqueta {
  font-size: 12px; color: var(--on-surface-variant);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.gr-barras.compacta { gap: 16px; }
.gr-barras.compacta .gr-fila { display: block; }
.gr-cabeza {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 10px; margin-bottom: 6px;
}
.gr-barras.compacta .gr-etiqueta {
  font-size: 13px; font-weight: 600; color: var(--on-surface);
  white-space: normal; overflow: visible;
}
.gr-barras.compacta .gr-pista { height: 8px; }
.gr-barras.compacta .gr-valor { min-width: 0; }
.gr-pista {
  position: relative; height: 20px;
  background: var(--surface-low);
  border-radius: var(--radio);
  overflow: hidden;
}
.gr-barra {
  height: 100%;
  background: var(--serie);
  border-radius: 0 var(--radio) var(--radio) 0;
  min-width: 2px;
  transition: width 220ms ease;
}
.gr-valor {
  font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums;
  color: var(--on-surface); white-space: nowrap; text-align: right;
  min-width: 92px;
}
.gr-fila:hover .gr-barra { background: var(--primary); }
.gr-vacia { color: var(--muted); font-size: 13px; padding: 24px 0; text-align: center; }

.leyenda-nota {
  margin-top: 16px; padding-top: 14px;
  border-top: 1px solid var(--gridline);
  font-size: 12px; color: var(--muted); line-height: 1.55;
}

/* ---------- Tablas ---------- */

.pestanas { display: flex; gap: 4px; flex-wrap: wrap; }
.pestanas button {
  padding: 7px 13px; font-size: 13px; font-weight: 600;
  border: 1px solid var(--outline); border-radius: var(--radio);
  background: var(--surface); color: var(--on-surface-variant);
}
.pestanas button[aria-selected="true"] {
  background: var(--secondary-container); color: var(--primary); border-color: var(--secondary-container);
}

/* El desglose puede tener 88 filas y una docena de columnas: se le da su propio
   marco con scroll en los dos ejes para que nunca empuje el ancho de la página. */
.tabla-scroll { overflow-x: auto; }
.tabla-scroll.alta { max-height: 560px; overflow-y: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
tbody td, thead th, tfoot td { white-space: nowrap; }
thead th {
  position: sticky; top: 0; z-index: 1;
  background: var(--surface-low);
  text-align: left; font-size: 11px; font-weight: 700;
  letter-spacing: 0.06em; text-transform: uppercase; color: var(--on-surface-variant);
  padding: 10px 12px; white-space: nowrap;
  border-bottom: 1px solid var(--outline);
}
tbody td { padding: 9px 12px; border-bottom: 1px solid var(--gridline); }
tbody tr:nth-child(even) { background: #fbfbfe; }
tbody tr:hover { background: var(--surface-low); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
tfoot td {
  padding: 12px; font-weight: 700;
  border-top: 2px solid var(--outline); background: var(--surface-low);
  font-variant-numeric: tabular-nums;
}
.sin-datos { padding: 40px 16px; text-align: center; color: var(--muted); }

/* ---------- Carga de ficheros ---------- */

.zona-carga {
  border: 2px dashed var(--outline-strong);
  border-radius: var(--radio-lg);
  background: var(--surface);
  padding: 28px 20px; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  transition: background 150ms ease, border-color 150ms ease;
}
.zona-carga.encima { border-color: var(--primary); background: var(--secondary-container); }
.zona-carga .icono-zona {
  width: 48px; height: 48px; border-radius: var(--radio-lg);
  background: var(--secondary-container); color: var(--primary);
  display: flex; align-items: center; justify-content: center;
}
.zona-carga h3 { font-size: 16px; }
.zona-carga .pista { color: var(--muted); font-size: 13px; }
.zona-carga input[type="file"] { display: none; }

/* ---------- Utilidades ---------- */

.fila { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.fila.fin { justify-content: flex-end; }
.entre { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.apilar { display: flex; flex-direction: column; gap: 16px; }
.apilar.junto { gap: 10px; }
.crece { flex: 1; min-width: 0; }
.silencio { color: var(--muted); font-size: 12px; }
.oculto { display: none !important; }

.barra-guardar {
  position: sticky; bottom: 0; z-index: 20;
  display: flex; justify-content: flex-end; align-items: center; gap: 16px;
  padding: 14px 32px;
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(6px);
  border-top: 1px solid var(--outline);
}

.aviso-flotante {
  position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
  z-index: 60; max-width: min(520px, calc(100vw - 32px));
  padding: 12px 18px; border-radius: var(--radio);
  background: var(--on-surface); color: #fff;
  box-shadow: var(--sombra-flotante);
  font-size: 13px;
}
.aviso-flotante.error { background: var(--error); }

/* ---------- Adaptación a pantallas estrechas ---------- */

@media (max-width: 1180px) {
  .rejilla.cuatro { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .rejilla.principal-lateral, .rejilla.tres { grid-template-columns: minmax(0, 1fr); }
}

@media (max-width: 900px) {
  .app { flex-direction: column; }
  .topbar { display: flex; }
  .sidebar {
    position: fixed; inset: 0 auto 0 0; z-index: 50;
    transform: translateX(-100%); transition: transform 200ms ease;
    box-shadow: var(--sombra-flotante);
  }
  .app.menu-abierto .sidebar { transform: none; }
  .velo {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(25, 28, 33, 0.4);
  }
  .panel-filtros {
    width: 100%; flex-basis: auto; height: auto; position: static;
    border-right: 0; border-bottom: 1px solid var(--outline);
  }
  .contenido { padding: 20px 16px; }
  .rejilla.dos, .rejilla.cuatro { grid-template-columns: minmax(0, 1fr); }
  .barra-guardar { padding: 12px 16px; }
  h1 { font-size: 24px; }
  .gr-fila { grid-template-columns: 1fr auto; }
  .gr-etiqueta { grid-column: 1 / -1; }
}

/* ---------- Impresión / exportación a PDF ---------- */

@media print {
  @page { size: A4 landscape; margin: 14mm; }
  body { background: #fff; font-size: 10.5pt; }
  .sidebar, .panel-filtros, .topbar, .pie, .barra-guardar,
  .no-imprimir, .velo, .aviso-flotante { display: none !important; }
  .app, .principal { display: block; }
  .contenido { padding: 0; max-width: none; }
  .tarjeta {
    box-shadow: none; border-color: #b9bdc9;
    break-inside: avoid; page-break-inside: avoid;
  }
  .rejilla { gap: 12px; }
  .rejilla.cuatro { grid-template-columns: repeat(4, 1fr); }
  .tabla-scroll, .tabla-scroll.alta { overflow: visible; max-height: none; }
  table { font-size: 8.5pt; }
  tbody td, thead th, tfoot td { white-space: normal; padding: 5px 6px; }
  thead { display: table-header-group; }
  thead th { position: static; }
  tr { break-inside: avoid; page-break-inside: avoid; }
  .lista-check { max-height: none; }
  .solo-impresion { display: block !important; }
  .gr-barra { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

.solo-impresion { display: none; }
.cabecera-impresion { margin-bottom: 18px; }
.cabecera-impresion h1 { font-size: 20pt; color: var(--primary); }
.cabecera-impresion .meta { color: var(--on-surface-variant); font-size: 10pt; margin-top: 4px; }

</style>
</head>

    { id: 'personalColaborador', nombre: 'Personal colaborador', base: 'mesas', agregable: true },
    { id: 'montajeTransporte', nombre: 'Montaje y transporte', base: 'mesas', agregable: true },
    { id: 'policia', nombre: 'Policía Autonómica y Local', base: 'efectivos', agregable: true },
    { id: 'miembrosMesa', nombre: 'Miembros de mesas electorales', base: 'mesas-x3', agregable: true },

    return {
      representantes: { PD0: 130, PD1: 170, PD2: 190, PD3: 210, PD4: 230, PD5: 250 },
      secretarios: { hasta10: 100, de11a50: 180, mas50: 250 },
      juecesPaz: 45,

      personalColaborador: 85,
      montajeTransporte: 110,
      policia: 90,

      miembrosPorMesa: 3,

        tarifaHasta10: 120,
        tarifaDesde11: 140,
        numHasta10: 0,
        numDesde11: 0
      }
    };
  }

  function estadoPorDefecto() {
    return {
      version: 1,
      convocatoria: 'Proceso electoral',
      config: configPorDefecto(),
      /* Datos cargados por municipio, indexados por código INE. */
      mesas: {},            // codigo -> nº de mesas
      representantes: {},   // codigo -> { PD0: n, ... }
      policia: {},          // codigo -> nº de efectivos
      cargas: {}            // origen -> { fecha, fichero, filas }
    };
  }

  /* Mezcla superficial y recursiva de los valores guardados sobre los valores por
     defecto, para que una versión nueva que añada un campo no rompa un estado
     antiguo. */
  function fusiona(base, guardado) {
    if (!guardado || typeof guardado !== 'object') { return base; }
    Object.keys(guardado).forEach(function (k) {
      var v = guardado[k];
      if (v && typeof v === 'object' && !Array.isArray(v) &&
          base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) {
        fusiona(base[k], v);
      } else if (v !== undefined) {
        base[k] = v;

    });
    return base;

    var bruto = null;
    try { bruto = window.localStorage.getItem(CLAVE); } catch (e) { bruto = null; }

    try {
      window.localStorage.setItem(CLAVE, JSON.stringify(estado));
    } catch (e) {
      console.warn('No se pudo guardar el estado', e);
      return false;
    }
    return true;
  }

    suscriptores.forEach(function (fn) { fn(estado); });
  }

    TIPOLOGIAS_PD: TIPOLOGIAS_PD,

    muta: function (fn) {

   Soporta CSV/TSV y XLSX. El XLSX se abre con las APIs del propio navegador

   no hace falta ninguna librería externa. */

  'use strict';

  /* ---------- CSV ---------- */

  function detectarDelimitador(linea) {
    var candidatos = [';', ',', '\t', '|'];
    var mejor = ';';
    var max = -1;
    candidatos.forEach(function (d) {
      var n = 0;
      var dentro = false;
      for (var i = 0; i < linea.length; i++) {
        var ch = linea[i];
        if (ch === '"') { dentro = !dentro; }
        else if (ch === d && !dentro) { n++; }

      if (n > max) { max = n; mejor = d; }
    });
    return max > 0 ? mejor : ';';

    var delim = detectarDelimitador(primeraLinea);

    var filas = [];
    var fila = [];
    var campo = '';
    var entreComillas = false;

    for (var i = 0; i < texto.length; i++) {
      var ch = texto[i];
      if (entreComillas) {
        if (ch === '"') {
          if (texto[i + 1] === '"') { campo += '"'; i++; }
          else { entreComillas = false; }
        } else { campo += ch; }
        continue;
      }
      if (ch === '"') { entreComillas = true; }
      else if (ch === delim) { fila.push(campo); campo = ''; }
      else if (ch === '\n') { fila.push(campo); filas.push(fila); fila = []; campo = ''; }
      else if (ch === '\r') { /* se ignora, el \n cierra la fila */ }
      else { campo += ch; }
    }
    if (campo !== '' || fila.length) { fila.push(campo); filas.push(fila); }

    return filas.filter(function (f) {
      return f.some(function (c) { return String(c).trim() !== ''; });
    });

  function indexarZip(buffer) {

    var eocd = -1;
    for (var i = bytes.length - 22; i >= 0 && i > bytes.length - 22 - 65536; i--) {

    }
    if (eocd < 0) { throw new Error('El fichero no es un XLSX válido (no se encontró el índice del ZIP).'); }

    var nEntradas = leerU16(dv, eocd + 10);
    var offCentral = leerU32(dv, eocd + 16);

    var entradas = {};
    var p = offCentral;
    for (var n = 0; n < nEntradas; n++) {

      var tamComprimido = leerU32(dv, p + 20);
      var lenNombre = leerU16(dv, p + 28);
      var lenExtra = leerU16(dv, p + 30);
      var lenComentario = leerU16(dv, p + 32);
      var offLocal = leerU32(dv, p + 42);
      var nombre = new TextDecoder('utf-8').decode(bytes.subarray(p + 46, p + 46 + lenNombre));
      entradas[nombre] = { offLocal: offLocal, metodo: metodo, tamComprimido: tamComprimido };

/* Motor de cálculo de gastos.
   Todo el dinero se calcula aquí y en ningún otro sitio: las vistas sólo pintan
   lo que devuelven estas funciones. */
(function (App) {
  'use strict';

  var PD = App.store.TIPOLOGIAS_PD;

  /* Un municipio se considera activo cuando tiene mesas cargadas. Los conceptos
     que se cobran "por municipio" (secretario, juez de paz) sólo devengan en los
     municipios activos: sin mesas no hay proceso electoral que atender. */
  function estaActivo(estado, codigo) {
    return (Number(estado.mesas[codigo]) || 0) > 0;
  }

  function tramoSecretario(cfg, mesas) {
    if (mesas <= 0) { return 0; }
    if (mesas <= 10) { return Number(cfg.secretarios.hasta10) || 0; }
    if (mesas <= 50) { return Number(cfg.secretarios.de11a50) || 0; }
    return Number(cfg.secretarios.mas50) || 0;
  }

  /* Desglose de un municipio: importe y "cantidad" (la magnitud sobre la que se
     calcula) por cada tipología agregable. */
  function calcularMunicipio(estado, codigo) {
    var cfg = estado.config;
    var mesas = Number(estado.mesas[codigo]) || 0;
    var efectivos = Number(estado.policia[codigo]) || 0;
    var reps = estado.representantes[codigo] || {};
    var activo = mesas > 0;

    var nRepresentantes = 0;
    var importeRepresentantes = 0;
    PD.forEach(function (t) {
      var n = Number(reps[t]) || 0;
      nRepresentantes += n;
      importeRepresentantes += n * (Number(cfg.representantes[t]) || 0);
    });

    var lineas = {
      representantes: {
        cantidad: nRepresentantes,
        unidad: 'representantes',
        importeUnitario: nRepresentantes ? importeRepresentantes / nRepresentantes : 0,
        importe: importeRepresentantes
      },
      secretarios: {
        cantidad: activo ? 1 : 0,
        unidad: 'secretarios',
        importeUnitario: tramoSecretario(cfg, mesas),
        importe: activo ? tramoSecretario(cfg, mesas) : 0
      },
      juecesPaz: {
        cantidad: activo ? 1 : 0,
        unidad: 'jueces',
        importeUnitario: Number(cfg.juecesPaz) || 0,
        importe: activo ? (Number(cfg.juecesPaz) || 0) : 0
      },
      acondicionamiento: {
        cantidad: mesas,
        unidad: 'mesas',
        importeUnitario: Number(cfg.acondicionamiento) || 0,
        importe: mesas * (Number(cfg.acondicionamiento) || 0)
      },
      personalColaborador: {
        cantidad: mesas,
        unidad: 'mesas',
        importeUnitario: Number(cfg.personalColaborador) || 0,
        importe: mesas * (Number(cfg.personalColaborador) || 0)
      },
      montajeTransporte: {
        cantidad: mesas,
        unidad: 'mesas',
        importeUnitario: Number(cfg.montajeTransporte) || 0,
        importe: mesas * (Number(cfg.montajeTransporte) || 0)
      },
      policia: {
        cantidad: efectivos,
        unidad: 'efectivos',
        importeUnitario: Number(cfg.policia) || 0,
        importe: efectivos * (Number(cfg.policia) || 0)
      },
      miembrosMesa: {
        cantidad: mesas * (Number(cfg.miembrosPorMesa) || 0),
        unidad: 'miembros',
        importeUnitario: Number(cfg.miembrosMesa) || 0,
        importe: mesas * (Number(cfg.miembrosPorMesa) || 0) * (Number(cfg.miembrosMesa) || 0)
      }
    };

    return {
      codigo: codigo,
      mesas: mesas,
      efectivos: efectivos,
      activo: activo,
      representantesPorTipo: reps,
      lineas: lineas
    };
  }

  /* Los coordinadores de tablets viven fuera del reparto territorial: se
     configuran como totales y se informan aparte. */
  function calcularCoordinadores(estado) {
    var c = estado.config.coordinadores || {};
    var nA = Number(c.numHasta10) || 0;
    var nB = Number(c.numDesde11) || 0;
    var tA = Number(c.tarifaHasta10) || 0;
    var tB = Number(c.tarifaDesde11) || 0;
    return {
      hasta10: { cantidad: nA, importeUnitario: tA, importe: nA * tA },
      desde11: { cantidad: nB, importeUnitario: tB, importe: nB * tB },
      total: nA * tA + nB * tB

  }

  /* Aplica los filtros del informe y devuelve los códigos de municipio en ámbito.
     filtros = { provincias: [], islas: [], municipios: [], soloActivos: bool } */
  function municipiosEnAmbito(estado, filtros) {
    return App.geo.MUNICIPIOS.filter(function (m) {
      if (filtros.provincias && filtros.provincias.length &&
          filtros.provincias.indexOf(m.provincia) < 0) { return false; }
      if (filtros.islas && filtros.islas.length &&
          filtros.islas.indexOf(m.isla) < 0) { return false; }
      if (filtros.municipios && filtros.municipios.length &&
          filtros.municipios.indexOf(m.codigo) < 0) { return false; }
      if (filtros.soloActivos && !estaActivo(estado, m.codigo)) { return false; }
      return true;

  function generarInforme(estado, filtros, tiposSeleccionados) {
    var codigos = municipiosEnAmbito(estado, filtros);
    var tipos = tiposSeleccionados || [];

    var porMunicipio = [];
    var totalPorTipo = {};
    var cantidadPorTipo = {};
    App.store.COLABORADORES.forEach(function (c) {
      totalPorTipo[c.id] = 0;
      cantidadPorTipo[c.id] = 0;
    });

    var totalGeneral = 0;
    var totalMesas = 0;
    var municipiosActivos = 0;

    codigos.forEach(function (codigo) {
      var det = calcularMunicipio(estado, codigo);
      var geo = App.geo.municipio(codigo);
      var subtotal = 0;
      var lineasFiltradas = {};

      Object.keys(det.lineas).forEach(function (tipo) {
        if (tipos.indexOf(tipo) < 0) { return; }
        var l = det.lineas[tipo];
        lineasFiltradas[tipo] = l;
        subtotal += l.importe;
        totalPorTipo[tipo] += l.importe;
        cantidadPorTipo[tipo] += l.cantidad;
      });

      totalMesas += det.mesas;
      if (det.activo) { municipiosActivos += 1; }
      totalGeneral += subtotal;

      porMunicipio.push({
        codigo: codigo,
        nombre: geo.nombre,
        isla: geo.isla,
        islaNombre: App.geo.isla(geo.isla).nombre,
        provincia: geo.provincia,
        provinciaNombre: App.geo.provincia(geo.provincia).nombre,
        mesas: det.mesas,
        efectivos: det.efectivos,
        activo: det.activo,
        lineas: lineasFiltradas,
        subtotal: subtotal
      });
    });

    /* Agregados territoriales, calculados sobre los municipios ya filtrados. */
    function agrupar(clave, nombreClave) {
      var mapa = {};
      porMunicipio.forEach(function (m) {
        var k = m[clave];
        if (!mapa[k]) {
          mapa[k] = { id: k, nombre: m[nombreClave], importe: 0, mesas: 0, municipios: 0 };
        }
        mapa[k].importe += m.subtotal;
        mapa[k].mesas += m.mesas;
        mapa[k].municipios += 1;
      });
      return Object.keys(mapa).map(function (k) { return mapa[k]; })
        .sort(function (a, b) { return b.importe - a.importe; });
    }

    var coordinadores = calcularCoordinadores(estado);
    var incluyeCoordinadores = tipos.indexOf('coordinadores') >= 0;

    return {
      generadoEn: new Date(),
      filtros: filtros,
      tipos: tipos,
      porMunicipio: porMunicipio,
      porIsla: agrupar('isla', 'islaNombre'),
      porProvincia: agrupar('provincia', 'provinciaNombre'),
      totalPorTipo: totalPorTipo,
      cantidadPorTipo: cantidadPorTipo,
      totalMesas: totalMesas,
      municipiosEnAmbito: codigos.length,
      municipiosActivos: municipiosActivos,
      /* Total territorial: la suma de todo lo que se reparte por municipio. */
      totalTerritorial: totalGeneral,
      coordinadores: coordinadores,
      incluyeCoordinadores: incluyeCoordinadores,
      /* Total general: territorial + coordinadores, que van aparte por diseño. */
      total: totalGeneral + (incluyeCoordinadores ? coordinadores.total : 0)
    };
  }

  App.calc = {
    calcularMunicipio: calcularMunicipio,
    calcularCoordinadores: calcularCoordinadores,
    municipiosEnAmbito: municipiosEnAmbito,
    tramoSecretario: tramoSecretario,
    generarInforme: generarInforme

/* Vista "Carga de Datos": los tres censos que alimentan los cálculos. */
(function (App) {
  'use strict';

  var el = App.ui.el;
  var icono = App.ui.icono;

  var FUENTES = [
    {
      id: 'mesas',

      icono: 'mesa',
      descripcion: 'Número de mesas electorales de cada municipio. Es el dato del que dependen casi todos los cálculos.',
      formato: 'Dos columnas: municipio (código INE, nombre o "35001 AGAETE") y número de mesas.',
      interpretar: 'interpretarMesas',
      aplicar: function (s, datos) { s.mesas = datos; }
    },
    {
      id: 'representantes',
      titulo: 'Representantes por municipio',

      descripcion: 'Número de representantes de la Administración de cada municipio, desglosado por tipología PD0 a PD5.',

    {

  function resumenCarga(id) {
    var carga = App.store.estado().cargas[id];
    if (!carga) {
      return el('span', { class: 'chip pendiente', text: 'Sin datos cargados' });
    }
    return el('div', { class: 'fila' }, [
      el('span', { class: 'chip ok' }, [icono('check', 13), App.ui.numero(carga.filas) + ' municipios']),
      el('span', {
        class: 'silencio',
        text: carga.fichero + ' · ' + App.ui.fecha(new Date(carga.fecha))
      })
    ]);
  }

  function procesar(fuente, file, alTerminar) {
    App.parsers.leerFichero(file)
      .then(function (filas) {
        var res = App.parsers[fuente.interpretar](filas);
        var n = Object.keys(res.datos).length;
        if (!n) {
          throw new Error('No se reconoció ningún municipio en el fichero. ' +
            'Revise que la primera columna contenga el código o el nombre del municipio.');
        }
        App.store.muta(function (s) {
          fuente.aplicar(s, res.datos);
          s.cargas[fuente.id] = {
            fecha: new Date().toISOString(),
            fichero: file.name,
            filas: n
          };
        });
        alTerminar(null, res.resumen);
      })
      .catch(function (err) {
        console.error(err);
        alTerminar(err);
      });
  }

  function zonaCarga(fuente) {
    var input = el('input', {
      type: 'file',
      accept: '.csv,.tsv,.txt,.xlsx',
      onChange: function (e) {
        if (e.target.files && e.target.files[0]) { manejar(e.target.files[0]); }
        e.target.value = '';
      }
    });

    var mensaje = el('div', { class: 'apilar junto', style: 'width:100%' });

    function manejar(file) {
      App.ui.vaciar(mensaje);
      mensaje.appendChild(el('p', { class: 'silencio', text: 'Leyendo ' + file.name + '…' }));

      procesar(fuente, file, function (err, res) {
        App.ui.vaciar(mensaje);
        if (err) {
          mensaje.appendChild(el('div', { class: 'aviso error' }, [icono('aviso'), el('div', { text: err.message })]));
          App.ui.flotante('No se pudo importar ' + file.name, true);
          return;
        }
        App.ui.flotante(res.filasImportadas + ' municipios importados en «' + fuente.titulo + '»');
        if (res.noReconocidos.length) {
          var muestra = res.noReconocidos.slice(0, 6).join(', ');
          mensaje.appendChild(el('div', { class: 'aviso' }, [
            icono('aviso'),
            el('div', {}, [
              el('strong', { text: res.noReconocidos.length + ' fila(s) sin municipio reconocible. ' }),
              'Se han ignorado: ' + muestra + (res.noReconocidos.length > 6 ? '…' : '')
            ])
          ]));
        }
        App.render();
      });
    }

    var zona = el('div', {
      class: 'zona-carga',
      tabindex: '0',
      role: 'button',
      'aria-label': 'Cargar fichero de ' + fuente.titulo,
      onClick: function () { input.click(); },
      onKeydown: function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); }
      },
      onDragover: function (e) { e.preventDefault(); zona.classList.add('encima'); },
      onDragleave: function () { zona.classList.remove('encima'); },
      onDrop: function (e) {
        e.preventDefault();
        zona.classList.remove('encima');
        if (e.dataTransfer.files && e.dataTransfer.files[0]) { manejar(e.dataTransfer.files[0]); }
      }
    }, [
      el('div', { class: 'icono-zona' }, [icono(fuente.icono, 24)]),
      el('h3', { text: fuente.titulo }),
      el('p', { class: 'pista', text: 'Arrastre el CSV o Excel aquí, o pulse para seleccionarlo' }),
      input
    ]);

    return el('section', { class: 'tarjeta' }, [
      el('header', {}, [
        el('h2', {}, [icono(fuente.icono), fuente.titulo]),
        resumenCarga(fuente.id)
      ]),
      el('p', { class: 'silencio', text: fuente.descripcion }),
      el('p', { class: 'silencio', style: 'margin-top:6px', text: 'Formato esperado — ' + fuente.formato }),
      el('div', { style: 'margin-top:18px' }, [zona]),
      mensaje
    ]);
  }

  /* Tabla de comprobación: qué hay cargado ahora mismo, municipio a municipio. */
  function tablaEstadoDatos() {
    var estado = App.store.estado();
    var filas = App.geo.MUNICIPIOS.map(function (m) {
      var reps = estado.representantes[m.codigo] || {};

      }, 0);
      return {
        m: m,
        mesas: Number(estado.mesas[m.codigo]) || 0,
        reps: totalReps,
        policia: Number(estado.policia[m.codigo]) || 0
      };

    var conDatos = filas.filter(function (f) { return f.mesas || f.reps || f.policia; });

        el('td', { class: 'n', text: App.ui.numero(f.policia) })

    var totales = conDatos.reduce(function (a, f) {

    }, { mesas: 0, reps: 0, policia: 0 });

    return el('section', { class: 'tarjeta' }, [
      el('header', {}, [
        el('h2', {}, [icono('documento'), 'Datos cargados']),

          el('span', {
            class: 'silencio',
            text: conDatos.length + ' de ' + App.geo.MUNICIPIOS.length + ' municipios con datos'

            el('table', {}, [

                  el('th', { text: 'Municipio' }),
                  el('th', { text: 'Isla' }),
                  el('th', { class: 'n', text: 'Mesas' }),
                  el('th', { class: 'n', text: 'Representantes' }),
                  el('th', { class: 'n', text: 'Efectivos policía' })
                ])
              ]),
              cuerpo,
              el('tfoot', {}, [
                el('tr', {}, [
                  el('td', { colspan: '3', text: 'Total' }),
                  el('td', { class: 'n', text: App.ui.numero(totales.mesas) }),
                  el('td', { class: 'n', text: App.ui.numero(totales.reps) }),
                  el('td', { class: 'n', text: App.ui.numero(totales.policia) })
                ])
              ])
            ])
          ])
        : el('p', {
            class: 'sin-datos',

  function tarjetaMantenimiento() {

/* ===== 70-vista-dashboard.js ===== */
/* Vista "Dashboard de Informes": filtros, indicadores, gráficas y tablas. */
(function (App) {
  'use strict';

  var el = App.ui.el;
  var icono = App.ui.icono;
  var euro = App.ui.euro;
  var numero = App.ui.numero;

  /* Los filtros viven en memoria durante la sesión: son una consulta, no un dato
     del proceso electoral, así que no se persisten con el resto del estado. */
  var filtros = null;

  function filtrosPorDefecto() {
    return {
      provincias: App.geo.PROVINCIAS.map(function (p) { return p.id; }),
      islas: App.geo.ISLAS.map(function (i) { return i.id; }),
      municipios: App.geo.MUNICIPIOS.map(function (m) { return m.codigo; }),
      tipos: App.store.COLABORADORES.map(function (c) { return c.id; }),
      soloActivos: true,
      busquedaMunicipio: '',
      busquedaTabla: '',
      pestana: 'municipio'
    };
  }

  function estadoFiltros() {
    if (!filtros) { filtros = filtrosPorDefecto(); }
    return filtros;
  }

  /* ---------- Controles de selección ---------- */

  function alterna(lista, valor, activo) {
    var i = lista.indexOf(valor);
    if (activo && i < 0) { lista.push(valor); }
    if (!activo && i >= 0) { lista.splice(i, 1); }
  }

  function checklist(opciones) {
    var f = estadoFiltros();
    var lista = el('div', { class: 'lista-check' + (opciones.corta ? ' corta' : '') });

    opciones.items.forEach(function (item) {
      var marcado = opciones.seleccion.indexOf(item.id) >= 0;
      lista.appendChild(el('label', { class: 'opcion-check' }, [
        el('input', {
          type: 'checkbox',
          checked: marcado,
          onChange: function (e) {
            opciones.alCambiar(item.id, e.target.checked);
            App.render();
          }
        }),
        el('span', { class: 'texto', text: item.nombre }),
        item.meta ? el('span', { class: 'meta', text: item.meta }) : null
      ]));
    });

    if (!opciones.items.length) {
      lista.appendChild(el('p', { class: 'silencio', style: 'padding:12px', text: 'Nada que mostrar con la selección de arriba.' }));
    }

    var bloque = el('div', { class: 'grupo-filtro' }, [
      el('div', { class: 'titulo-filtro' }, [
        el('strong', { text: opciones.titulo }),
        el('span', {
          class: 'cuenta',
          text: opciones.seleccion.filter(function (id) {
            return opciones.items.some(function (it) { return it.id === id; });
          }).length + ' / ' + opciones.items.length
        })
      ]),
      el('div', { class: 'acciones-filtro' }, [
        el('button', {
          type: 'button',
          onClick: function () { opciones.alTodos(true); App.render(); }
        }, 'Todos'),
        el('button', {
          type: 'button',
          onClick: function () { opciones.alTodos(false); App.render(); }
        }, 'Ninguno')
      ])
    ]);

    if (opciones.buscador) {
      bloque.appendChild(el('input', {
        type: 'search',
        placeholder: 'Buscar municipio…',
        value: f.busquedaMunicipio,
        style: 'margin-bottom:8px',
        onInput: function (e) {
          f.busquedaMunicipio = e.target.value;
          App.render({ foco: 'buscador-municipio' });
        },
        id: 'buscador-municipio'
      }));
    }

    bloque.appendChild(lista);
    return bloque;
  }

  function panelFiltros() {
    var f = estadoFiltros();
    var estado = App.store.estado();

    var islasVisibles = App.geo.ISLAS.filter(function (i) {
      return f.provincias.indexOf(i.provincia) >= 0;
    });

    var termino = App.geo.normaliza(f.busquedaMunicipio);
    var municipiosVisibles = App.geo.MUNICIPIOS.filter(function (m) {
      if (f.islas.indexOf(m.isla) < 0) { return false; }
      if (f.provincias.indexOf(m.provincia) < 0) { return false; }
      if (termino && App.geo.normaliza(m.nombre).indexOf(termino) < 0 &&
          m.codigo.indexOf(termino) < 0) { return false; }
      return true;
    });

    /* Al desmarcar un ámbito superior se arrastra lo que cuelga de él, para que
       los contadores del panel no mientan. */
    function cascadaProvincia(id, activo) {
      alterna(f.provincias, id, activo);
      App.geo.islasDe(id).forEach(function (isla) {
        alterna(f.islas, isla.id, activo);
        App.geo.municipiosDe(isla.id).forEach(function (m) {
          alterna(f.municipios, m.codigo, activo);
        });
      });
    }

    function cascadaIsla(id, activo) {
      alterna(f.islas, id, activo);
      App.geo.municipiosDe(id).forEach(function (m) {
        alterna(f.municipios, m.codigo, activo);
      });
      if (activo) { alterna(f.provincias, App.geo.isla(id).provincia, true); }
    }

    return el('aside', { class: 'panel-filtros no-imprimir' }, [
      el('div', { class: 'entre' }, [
        el('h2', { text: 'Filtros de informe' }),
        el('button', {
          class: 'btn fantasma pequeno',
          title: 'Restablecer todos los filtros',
          onClick: function () { filtros = filtrosPorDefecto(); App.render(); }
        }, 'Reiniciar')
      ]),

      checklist({
        titulo: 'Provincia',
        items: App.geo.PROVINCIAS.map(function (p) { return { id: p.id, nombre: p.nombre }; }),
        seleccion: f.provincias,
        corta: true,
        alCambiar: cascadaProvincia,
        alTodos: function (v) {
          App.geo.PROVINCIAS.forEach(function (p) { cascadaProvincia(p.id, v); });
        }
      }),

      checklist({
        titulo: 'Isla',
        items: islasVisibles.map(function (i) { return { id: i.id, nombre: i.nombre }; }),
        seleccion: f.islas,
        corta: true,
        alCambiar: cascadaIsla,
        alTodos: function (v) {
          islasVisibles.forEach(function (i) { cascadaIsla(i.id, v); });
        }
      }),

      checklist({
        titulo: 'Municipio',
        buscador: true,
        items: municipiosVisibles.map(function (m) {
          var mesas = Number(estado.mesas[m.codigo]) || 0;
          return {
            id: m.codigo,
            nombre: m.nombre,
            meta: mesas ? mesas + ' mesas' : '—'
          };
        }),
        seleccion: f.municipios,
        alCambiar: function (id, activo) { alterna(f.municipios, id, activo); },
        alTodos: function (v) {
          municipiosVisibles.forEach(function (m) { alterna(f.municipios, m.codigo, v); });
        }
      }),

      checklist({
        titulo: 'Colaboradores',
        items: App.store.COLABORADORES.map(function (c) {
          return { id: c.id, nombre: c.nombre, meta: c.agregable ? null : 'aparte' };
        }),
        seleccion: f.tipos,
        corta: true,
        alCambiar: function (id, activo) { alterna(f.tipos, id, activo); },
        alTodos: function (v) {
          App.store.COLABORADORES.forEach(function (c) { alterna(f.tipos, c.id, v); });
        }
      }),

      el('label', { class: 'opcion-check', style: 'border:1px solid var(--outline);border-radius:4px' }, [
        el('input', {
          type: 'checkbox',
          checked: f.soloActivos,
          onChange: function (e) { f.soloActivos = e.target.checked; App.render(); }
        }),
        el('span', { class: 'texto', text: 'Sólo municipios con mesas' })
      ])
    ]);
  }

  /* ---------- Indicadores ---------- */

  function kpis(informe) {
    var costeMesa = informe.totalMesas ? informe.totalTerritorial / informe.totalMesas : 0;

    function tarjeta(etiqueta, valor, nota, destacado) {
      return el('div', { class: 'tarjeta kpi' }, [
        el('span', { class: 'etiqueta', text: etiqueta }),
        el('span', { class: 'valor num' + (destacado ? ' destacado' : ''), text: valor }),
        el('span', { class: 'nota', text: nota })
      ]);
    }

    return el('div', { class: 'rejilla cuatro' }, [
      tarjeta('Coste total', App.ui.euroCorto(informe.total),
        informe.incluyeCoordinadores
          ? 'Incluye ' + euro(informe.coordinadores.total) + ' de coordinadores'
          : 'Coordinadores no incluidos en la selección',
        true),
      tarjeta('Mesas electorales', numero(informe.totalMesas),
        informe.totalMesas ? euro(costeMesa) + ' por mesa' : 'Sin mesas cargadas'),
      tarjeta('Municipios', numero(informe.porMunicipio.length),
        'de ' + numero(App.geo.MUNICIPIOS.length) + ' en Canarias'),
      tarjeta('Tipologías', numero(informe.tipos.length),
        'de ' + App.store.COLABORADORES.length + ' colaboradores')
    ]);
  }

  /* ---------- Gráficas ---------- */

  function graficas(informe) {
    var porTipo = App.store.COLABORADORES
      .filter(function (c) { return c.agregable && informe.tipos.indexOf(c.id) >= 0; })
      .map(function (c) {
        return { etiqueta: c.nombre, valor: informe.totalPorTipo[c.id] };
      });

    var porProvincia = informe.porProvincia.map(function (p) {
      return { etiqueta: p.nombre, valor: p.importe };
    });

    var porIsla = informe.porIsla.map(function (i) {
      return { etiqueta: i.nombre, valor: i.importe };
    });

    return el('div', { class: 'rejilla principal-lateral' }, [
      el('section', { class: 'tarjeta' }, [
        el('header', {}, [
          el('h2', { text: 'Gasto por tipo de colaborador' }),
          el('span', { class: 'silencio', text: 'Total repartible: ' + euro(informe.totalTerritorial) })
        ]),
        App.ui.barras(porTipo),
        informe.incluyeCoordinadores && informe.coordinadores.total > 0
          ? el('p', {
              class: 'leyenda-nota',
              text: 'Los coordinadores de tablets (' + euro(informe.coordinadores.total) +
                ') no aparecen en esta gráfica porque no se reparten por territorio. ' +
                'Sí están incluidos en el coste total.'
            })
          : null
      ]),
      el('div', { class: 'apilar', style: 'gap:24px' }, [
        el('section', { class: 'tarjeta' }, [
          el('header', {}, [el('h2', { text: 'Por provincia' })]),
          App.ui.barras(porProvincia, { compacta: true })
        ]),
        el('section', { class: 'tarjeta' }, [
          el('header', {}, [el('h2', { text: 'Por isla' })]),
          App.ui.barras(porIsla, { compacta: true })
        ])
      ])
    ]);
  }

  /* ---------- Tablas ---------- */

  var PESTANAS = [
    { id: 'municipio', nombre: 'Por municipio' },
    { id: 'isla', nombre: 'Por isla' },
    { id: 'provincia', nombre: 'Por provincia' },
    { id: 'colaborador', nombre: 'Por colaborador' },
    { id: 'detalle', nombre: 'Detalle línea a línea' }
  ];

  /* Cada constructor devuelve { columnas, filas, totales } en un formato común,
     de modo que el pintado y la exportación a CSV se escriben una sola vez. */
  function datosTabla(informe, pestana, termino) {
    var tiposAgregables = App.store.COLABORADORES.filter(function (c) {
      return c.agregable && informe.tipos.indexOf(c.id) >= 0;
    });

    function coincide(txt) {
      if (!termino) { return true; }
      return App.geo.normaliza(txt).indexOf(termino) >= 0;
    }

    if (pestana === 'municipio') {
      var columnas = [
        { clave: 'codigo', nombre: 'Código' },
        { clave: 'nombre', nombre: 'Municipio' },
        { clave: 'isla', nombre: 'Isla' },
        { clave: 'mesas', nombre: 'Mesas', num: true }
      ].concat(tiposAgregables.map(function (c) {
        return { clave: c.id, nombre: c.nombre, num: true, dinero: true };
      })).concat([{ clave: 'subtotal', nombre: 'Subtotal', num: true, dinero: true, fuerte: true }]);

      var filas = informe.porMunicipio
        .filter(function (m) { return coincide(m.nombre + ' ' + m.codigo); })
        .sort(function (a, b) { return b.subtotal - a.subtotal; })
        .map(function (m) {
          var fila = {
            codigo: m.codigo, nombre: m.nombre, isla: m.islaNombre,
            mesas: m.mesas, subtotal: m.subtotal
          };
          tiposAgregables.forEach(function (c) {
            fila[c.id] = m.lineas[c.id] ? m.lineas[c.id].importe : 0;
          });
          return fila;
        });

      var totales = { codigo: '', nombre: 'Total', isla: '', mesas: 0, subtotal: 0 };
      tiposAgregables.forEach(function (c) { totales[c.id] = 0; });
      filas.forEach(function (f) {
        totales.mesas += f.mesas;
        totales.subtotal += f.subtotal;
        tiposAgregables.forEach(function (c) { totales[c.id] += f[c.id]; });
      });
      return { columnas: columnas, filas: filas, totales: totales };
    }

    if (pestana === 'isla' || pestana === 'provincia') {
      var origen = pestana === 'isla' ? informe.porIsla : informe.porProvincia;
      var lista = origen.filter(function (g) { return coincide(g.nombre); });
      return {
        columnas: [
          { clave: 'nombre', nombre: pestana === 'isla' ? 'Isla' : 'Provincia' },
          { clave: 'municipios', nombre: 'Municipios', num: true },
          { clave: 'mesas', nombre: 'Mesas', num: true },
          { clave: 'importe', nombre: 'Importe', num: true, dinero: true, fuerte: true },
          { clave: 'peso', nombre: '% del total', num: true }
        ],
        filas: lista.map(function (g) {
          return {
            nombre: g.nombre, municipios: g.municipios, mesas: g.mesas, importe: g.importe,
            peso: App.ui.porcentaje(g.importe, informe.totalTerritorial)
          };
        }),
        totales: {
          nombre: 'Total',
          municipios: lista.reduce(function (a, g) { return a + g.municipios; }, 0),
          mesas: lista.reduce(function (a, g) { return a + g.mesas; }, 0),
          importe: lista.reduce(function (a, g) { return a + g.importe; }, 0),
          peso: ''
        }
      };
    }

    if (pestana === 'colaborador') {
      var filasC = App.store.COLABORADORES
        .filter(function (c) { return informe.tipos.indexOf(c.id) >= 0; })
        .filter(function (c) { return coincide(c.nombre); })
        .map(function (c) {
          if (!c.agregable) {
            return {
              nombre: c.nombre,
              cantidad: informe.coordinadores.hasta10.cantidad + informe.coordinadores.desde11.cantidad,
              unidad: 'coordinadores',
              importe: informe.coordinadores.total,
              ambito: 'Global (no territorializado)'
            };
          }
          var unidad = '';
          informe.porMunicipio.some(function (m) {
            if (m.lineas[c.id]) { unidad = m.lineas[c.id].unidad; return true; }
            return false;
          });
          return {
            nombre: c.nombre,
            cantidad: informe.cantidadPorTipo[c.id],
            unidad: unidad,
            importe: informe.totalPorTipo[c.id],
            ambito: 'Reparto territorial'
          };
        });

      return {
        columnas: [
          { clave: 'nombre', nombre: 'Colaborador' },
          { clave: 'cantidad', nombre: 'Cantidad', num: true },
          { clave: 'unidad', nombre: 'Unidad' },
          { clave: 'ambito', nombre: 'Ámbito' },
          { clave: 'importe', nombre: 'Importe', num: true, dinero: true, fuerte: true }
        ],
        filas: filasC,
        totales: {
          nombre: 'Total', cantidad: '', unidad: '', ambito: '',
          importe: filasC.reduce(function (a, f) { return a + f.importe; }, 0)
        }
      };
    }

    /* detalle: una línea por municipio y tipología, como en el prototipo. */
    var detalle = [];
    informe.porMunicipio.forEach(function (m) {
      if (!coincide(m.nombre + ' ' + m.codigo)) { return; }
      tiposAgregables.forEach(function (c) {
        var l = m.lineas[c.id];
        if (!l || (!l.importe && !l.cantidad)) { return; }
        detalle.push({
          municipio: m.nombre,
          isla: m.islaNombre,
          colaborador: c.nombre,
          unitario: l.importeUnitario,
          cantidad: l.cantidad,
          unidad: l.unidad,
          importe: l.importe
        });
      });
    });

    return {
      columnas: [
        { clave: 'municipio', nombre: 'Municipio' },
        { clave: 'isla', nombre: 'Isla' },
        { clave: 'colaborador', nombre: 'Colaborador' },
        { clave: 'unitario', nombre: 'Imp. unitario', num: true, dinero: true },
        { clave: 'cantidad', nombre: 'Cantidad', num: true },
        { clave: 'unidad', nombre: 'Unidad' },
        { clave: 'importe', nombre: 'Subtotal', num: true, dinero: true, fuerte: true }
      ],
      filas: detalle,
      totales: {
        municipio: 'Total', isla: '', colaborador: '', unitario: '', cantidad: '', unidad: '',
        importe: detalle.reduce(function (a, f) { return a + f.importe; }, 0)
      }
    };
  }

  function formatearCelda(col, valor) {
    if (valor === '' || valor == null) { return ''; }
    if (col.dinero) { return euro(valor); }
    if (col.num && typeof valor === 'number') { return numero(valor); }
    return String(valor);
  }

  function tablaInforme(informe) {
    var f = estadoFiltros();
    var termino = App.geo.normaliza(f.busquedaTabla);
    var datos = datosTabla(informe, f.pestana, termino);

    var cuerpo = el('tbody');
    datos.filas.forEach(function (fila) {
      cuerpo.appendChild(el('tr', {}, datos.columnas.map(function (col) {
        return el('td', {
          class: col.num ? 'n' : null,
          style: col.fuerte ? 'font-weight:600' : null,
          text: formatearCelda(col, fila[col.clave])
        });
      })));
    });

    var tabla = el('table', {}, [
      el('thead', {}, [
        el('tr', {}, datos.columnas.map(function (col) {
          return el('th', { class: col.num ? 'n' : null, text: col.nombre });
        }))
      ]),
      cuerpo,
      el('tfoot', {}, [
        el('tr', {}, datos.columnas.map(function (col) {
          return el('td', {
            class: col.num ? 'n' : null,
            text: formatearCelda(col, datos.totales[col.clave])
          });
        }))
      ])
    ]);

    return el('section', { class: 'tarjeta' }, [
      el('header', {}, [
        el('h2', { text: 'Desglose del informe' }),
        el('div', { class: 'fila no-imprimir' }, [
          el('input', {
            type: 'search',
            id: 'buscador-tabla',
            placeholder: 'Filtrar…',
            value: f.busquedaTabla,
            style: 'width:180px',
            onInput: function (e) {
              f.busquedaTabla = e.target.value;
              App.render({ foco: 'buscador-tabla' });
            }
          }),
          el('button', {
            class: 'btn secundario pequeno',
            onClick: function () {
              var filas = [datos.columnas.map(function (c) { return c.nombre; })];
              datos.filas.forEach(function (fila) {
                filas.push(datos.columnas.map(function (c) {
                  var v = fila[c.clave];
                  return typeof v === 'number' ? String(v).replace('.', ',') : (v == null ? '' : v);
                }));
              });
              App.ui.descargar('informe-' + f.pestana + '.csv', App.ui.aCSV(filas));
              App.ui.flotante('CSV descargado');
            }
          }, [icono('descarga', 14), 'CSV'])
        ])
      ]),
      el('div', { class: 'pestanas no-imprimir', role: 'tablist', style: 'margin-bottom:16px' },
        PESTANAS.map(function (p) {
          return el('button', {
            role: 'tab',
            'aria-selected': String(f.pestana === p.id),
            onClick: function () { f.pestana = p.id; App.render(); }
          }, p.nombre);
        })
      ),
      datos.filas.length
        ? el('div', { class: 'tabla-scroll alta' }, [tabla])
        : el('p', { class: 'sin-datos', text: 'No hay líneas que mostrar con los filtros actuales.' })
    ]);
  }

  /* ---------- Coordinadores, siempre aparte ---------- */

  function tarjetaCoordinadores(informe) {
    if (!informe.incluyeCoordinadores) { return null; }
    var c = informe.coordinadores;

    function linea(nombre, dato) {
      return el('tr', {}, [
        el('td', { text: nombre }),
        el('td', { class: 'n', text: numero(dato.cantidad) }),
        el('td', { class: 'n', text: euro(dato.importeUnitario) }),
        el('td', { class: 'n', style: 'font-weight:600', text: euro(dato.importe) })
      ]);
    }

    return el('section', { class: 'tarjeta' }, [
      el('header', {}, [
        el('h2', {}, [icono('tableta'), 'Coordinadores de tablets']),
        el('span', { class: 'chip aviso', text: 'Importe independiente' })
      ]),
      el('p', {
        class: 'silencio',
        text: 'No se reparte por municipio, isla ni provincia. Se suma únicamente al coste total del informe.'
      }),
      el('div', { class: 'tabla-scroll', style: 'margin-top:16px' }, [
        el('table', {}, [
          el('thead', {}, [
            el('tr', {}, [
              el('th', { text: 'Tramo de colegio' }),
              el('th', { class: 'n', text: 'Coordinadores' }),
              el('th', { class: 'n', text: 'Imp. unitario' }),
              el('th', { class: 'n', text: 'Importe' })
            ])
          ]),
          el('tbody', {}, [
            linea('Colegios de hasta 10 mesas', c.hasta10),
            linea('Colegios de 11 mesas o más', c.desde11)
          ]),
          el('tfoot', {}, [
            el('tr', {}, [
              el('td', { text: 'Total' }),
              el('td', { class: 'n', text: numero(c.hasta10.cantidad + c.desde11.cantidad) }),
              el('td', {}),
              el('td', { class: 'n', text: euro(c.total) })
            ])
          ])
        ])
      ])
    ]);
  }

  /* ---------- Cabecera del informe y exportación ---------- */

  function resumenAmbito(informe) {
    var f = estadoFiltros();
    var partes = [];

    var todasProv = f.provincias.length === App.geo.PROVINCIAS.length;
    partes.push(todasProv
      ? 'Todas las provincias'
      : f.provincias.map(function (id) { return App.geo.provincia(id).nombre; }).join(', ') || 'Ninguna provincia');

    var islasEnAmbito = App.geo.ISLAS.filter(function (i) { return f.provincias.indexOf(i.provincia) >= 0; });
    var islasSel = islasEnAmbito.filter(function (i) { return f.islas.indexOf(i.id) >= 0; });
    partes.push(islasSel.length === islasEnAmbito.length
      ? 'todas las islas'
      : islasSel.map(function (i) { return i.nombre; }).join(', ') || 'ninguna isla');

    partes.push(numero(informe.porMunicipio.length) + ' municipios');
    partes.push(numero(informe.tipos.length) + ' de ' + App.store.COLABORADORES.length + ' tipologías');
    if (f.soloActivos) { partes.push('sólo municipios con mesas'); }

    return partes.join(' · ');
  }

  function cabeceraInforme(informe) {
    var estado = App.store.estado();

    return el('div', {}, [
      /* Cabecera visible sólo al imprimir o exportar a PDF. */
      el('div', { class: 'solo-impresion cabecera-impresion' }, [
        el('h1', { text: 'Informe de gastos — ' + estado.convocatoria }),
        el('p', { class: 'meta', text: 'Generado el ' + App.ui.fecha(informe.generadoEn) }),
        el('p', { class: 'meta', text: 'Ámbito: ' + resumenAmbito(informe) })
      ]),

      el('div', { class: 'entre no-imprimir', style: 'margin-bottom:24px' }, [
        el('div', {}, [
          el('h1', { text: 'Informe general de gastos' }),
          el('p', {
            style: 'color:var(--on-surface-variant);margin-top:6px',
            text: estado.convocatoria + ' · Generado el ' + App.ui.fecha(informe.generadoEn)
          }),
          el('p', { class: 'silencio', style: 'margin-top:4px', text: resumenAmbito(informe) })
        ]),
        el('div', { class: 'fila' }, [
          el('button', {
            class: 'btn',
            onClick: function () { window.print(); }
          }, [icono('imprimir', 16), 'Exportar a PDF'])
        ])
      ])
    ]);
  }

  function sinDatos() {
    return el('section', { class: 'tarjeta' }, [
      el('div', { class: 'aviso' }, [
        icono('aviso'),
        el('div', {}, [
          el('strong', { text: 'Todavía no hay mesas cargadas. ' }),
          'El número de mesas por municipio es la base de casi todos los cálculos. ' +
          'Vaya a «Carga de Datos», descargue la plantilla CSV con los 88 municipios y súbala rellena.'
        ])
      ]),
      el('div', { class: 'fila', style: 'margin-top:18px' }, [
        el('button', {
          class: 'btn',
          onClick: function () { App.irA('datos'); }
        }, [icono('carga', 16), 'Ir a Carga de Datos'])
      ])
    ]);
  }

  App.vistas = App.vistas || {};
  App.vistas.dashboard = {
    titulo: 'Dashboard de Informes',
    panelLateral: panelFiltros,
    render: function () {
      var estado = App.store.estado();
      var f = estadoFiltros();
      var hayMesas = Object.keys(estado.mesas).some(function (k) { return estado.mesas[k] > 0; });

      var informe = App.calc.generarInforme(estado, {
        provincias: f.provincias,
        islas: f.islas,
        municipios: f.municipios,
        soloActivos: f.soloActivos
      }, f.tipos);

      App.ultimoInforme = informe;

      return el('div', { class: 'apilar', style: 'gap:24px' }, [
        cabeceraInforme(informe),
        hayMesas ? null : sinDatos(),
        kpis(informe),
        graficas(informe),
        tarjetaCoordinadores(informe),
        tablaInforme(informe)
      ]);
    }
  };
})(window.App = window.App || {});

/* Armazón de la aplicación: navegación, pintado y arranque. */
(function (App) {
  'use strict';

  var el = App.ui.el;
  var icono = App.ui.icono;

  var VISTAS = [
    { id: 'dashboard', nombre: 'Dashboard de Informes', icono: 'dashboard' },
    { id: 'configuracion', nombre: 'Configuración de Importes', icono: 'ajustes' },
    { id: 'datos', nombre: 'Carga de Datos', icono: 'carga' }
  ];

  var actual = 'dashboard';
  var menuAbierto = false;

  function barraSuperior() {
    return el('header', { class: 'topbar no-imprimir' }, [
      el('button', {
        class: 'btn fantasma pequeno',
        'aria-label': 'Abrir menú de navegación',
        'aria-expanded': String(menuAbierto),
        onClick: function () { menuAbierto = !menuAbierto; App.render(); }
      }, [icono('menu', 20)]),
      el('strong', { text: 'Elecciones Canarias' })
    ]);
  }

  function barraLateral() {
    return el('nav', { class: 'sidebar no-imprimir', 'aria-label': 'Navegación principal' }, [
      el('div', {}, [
        el('div', { class: 'marca-titulo', text: 'Gestión Electoral' }),
        el('div', { class: 'marca-sub', text: 'Administración de gastos' })
      ]),
      el('div', { class: 'nav' }, VISTAS.map(function (v) {
        return el('button', {
          'aria-current': actual === v.id ? 'page' : null,
          onClick: function () { App.irA(v.id); }
        }, [icono(v.icono), v.nombre]);
      })),
      el('div', { style: 'margin-top:auto' }, [
        el('p', { class: 'silencio', text: 'Datos guardados en este navegador' })
      ])
    ]);
  }

  function pie() {
    return el('footer', { class: 'pie no-imprimir' }, [
      el('span', { text: 'Sistema de gestión de colaboradores electorales — Canarias' }),
      el('span', { text: App.geo.MUNICIPIOS.length + ' municipios · 7 islas · 2 provincias' })
    ]);
  }

  /* render({ foco }) reconstruye la vista actual. `foco` reinstala el cursor en
     un campo tras el repintado, para que escribir en un buscador no lo pierda. */
  App.render = function (opciones) {
    opciones = opciones || {};
    var vista = App.vistas[actual];
    var raiz = document.getElementById('app');

    var seleccion = null;
    if (opciones.foco) {
      var previo = document.getElementById(opciones.foco);
      if (previo) { seleccion = previo.selectionStart; }
    }

    App.ui.vaciar(raiz);
    raiz.className = 'app' + (menuAbierto ? ' menu-abierto' : '');

    var contenido = el('div', { class: 'contenido' }, [
      vista.titulo && actual !== 'dashboard'
        ? el('div', { class: 'cabecera-pagina no-imprimir' }, [
            el('h1', { text: vista.titulo }),
            vista.subtitulo ? el('p', { text: vista.subtitulo }) : null
          ])
        : null,
      vista.render()
    ]);

    raiz.appendChild(barraLateral());
    if (menuAbierto) {
      raiz.appendChild(el('div', {
        class: 'velo no-imprimir',
        onClick: function () { menuAbierto = false; App.render(); }
      }));
    }
    if (vista.panelLateral) { raiz.appendChild(vista.panelLateral()); }
    raiz.appendChild(el('div', { class: 'principal' }, [contenido, pie()]));

    /* La barra superior sólo existe en pantallas estrechas; se inserta al
       principio para que quede pegada arriba. */
    raiz.insertBefore(barraSuperior(), raiz.firstChild);

    if (opciones.foco) {
      var campo = document.getElementById(opciones.foco);
      if (campo) {
        campo.focus();
        if (seleccion != null && campo.setSelectionRange) {
          try { campo.setSelectionRange(seleccion, seleccion); } catch (e) { /* tipos sin selección */ }
        }
      }
    }
  };

  App.irA = function (id) {
    actual = id;
    menuAbierto = false;
    App.render();
    window.scrollTo(0, 0);
  };

  App.iniciar = function () {
    App.store.init();
    App.render();
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', App.iniciar);
  } else {
    App.iniciar();
  }
})(window.App = window.App || {});

</script>
</body>
</html>
